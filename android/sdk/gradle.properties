# Build-wide Gradle settings. Nothing here may be machine-specific: no absolute paths,
# no local SDK locations (the Android SDK comes from ANDROID_HOME in the environment).

org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

kotlin.code.style=official

android.useAndroidX=true
