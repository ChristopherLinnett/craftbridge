# Every version in the Android build, in one place: no module or convention plugin writes a
# version of its own.

[versions]
android-compileSdk = "37"
android-minSdk = "29"
# The build tools every compile uses, pinned so the doctor checks the very ones the build asks for:
# AGP's own default (36.0.0 for AGP 9.5) would otherwise change with AGP and go unchecked.
android-buildTools = "37.0.0"
# The JDK Gradle and the convention plugins run on, and the Java level the libraries compile to.
jdk = "21"
java-bytecode = "17"
agp = "9.5.1"
kotlin = "2.4.21"
spotless = "8.11.0"
ktlint = "1.8.0"
# The detekt the gate runs. It carries its own Kotlin compiler for its analysis, so its line must be
# built on the `kotlin` above: detekt 2.0, built on Kotlin 2.4, reads the stdlib the modules compile
# against, which the 1.x line (Kotlin 2.0) cannot, and so resolves nothing from it. The 2.0 line ships
# as pre-releases.
detekt = "2.0.0-alpha.6"
# The TestNG every module's unit tests, and the gate rules' own, run on. kotlin-test-testng drags a TestNG
# of its own along transitively, so without this the test framework would move with its binding unseen.
# It is strict, so Gradle takes no other version wherever it is handed out: a lower one asked for elsewhere
# gives way to this one, and a higher one, or any other asked for strictly, fails the build. A release must
# run with the catalog's Gradle, JDK and kotlin-test binding; the newest that does is kept here, and the
# update loop (plan §24) names newer ones for a change of their own. UnrunTest reads TestNG as this release
# runs a test, so that change runs the rule's shapes on the newer release too.
testng = { strictly = "7.12.0" }
# The library the generated bindings load the native library with.
jna = "5.18.1"
# The coroutines the generated bindings' async calls suspend on.
kotlinx-coroutines = "1.10.2"
# The JSON parser and printer the engine's text requests are read with and written with.
kotlinx-serialization = "1.11.0"
# The TOML reader the conformance corpus's instrumented checks parse it with.
tomlj = "2.2.0"
# What the samples' Compose interface is built on: the UI toolkit's own line, Material 3 (its own line), the
# activity's Compose host and photo picker, and the view model the screen's state lives in. Samples only: no
# SDK module carries them.
compose = "1.12.1"
material3 = "1.4.0"
activity = "1.12.4"
lifecycle = "2.11.1"

[plugins]
android-library = { id = "com.android.library", version.ref = "agp" }
android-application = { id = "com.android.application", version.ref = "agp" }
# Compose's compiler is a Kotlin compiler plugin and is versioned with Kotlin.
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }

[libraries]
# The convention plugins compile against these; the build uses the copies the plugins block at
# the root puts on its classpath, at the same versions.
android-gradle-plugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
spotless-gradle-plugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }
# detekt's own pieces: the command-line tool the convention plugin launches per component, the API and
# the suppression check the build's own rules in build-logic/detekt-rules compile against, and the test
# fixtures they test with. The rules' tests run on TestNG: kotlin-test binds to JUnit 4 by default,
# whose EPL-1.0 is on no branch of the allowlist (rust/deny.toml), and the licence check reads the
# rules' own test classpaths as closely as a module's. kotlin-test-testng binds the same kotlin.test
# assertions to Apache-2.0 TestNG, which is what useTestNG() runs, in detekt-rules and, through the
# convention plugin, in every module's unit tests.
detekt-cli = { module = "dev.detekt:detekt-cli", version.ref = "detekt" }
detekt-api = { module = "dev.detekt:detekt-api", version.ref = "detekt" }
detekt-core = { module = "dev.detekt:detekt-core", version.ref = "detekt" }
detekt-test = { module = "dev.detekt:detekt-test", version.ref = "detekt" }
kotlin-test-testng = { module = "org.jetbrains.kotlin:kotlin-test-testng", version.ref = "kotlin" }
testng = { module = "org.testng:testng", version.ref = "testng" }
# What the generated bindings call into: UniFFI's Kotlin reaches the native library through JNA, which
# ships as an AAR for Android (the convention plugin hands that one out). JNA is Apache-2.0 or LGPL; the
# repository uses it under Apache-2.0 (AGENTS.md §8).
jna = { module = "net.java.dev.jna:jna", version.ref = "jna" }
# UniFFI's async functions are `suspend` functions of this library, in the bindings' public API.
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
# The engine speaks JSON text; the plugin module reads and writes it with kotlinx's own parser rather
# than a hand-written one. The json artifact brings the serialization core it is built on, at its own version.
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
# Reads `conformance/effects/corpus.toml`, the one file every runner reads, in the instrumented checks alone: it
# is an `androidTestImplementation`, so no library module ships it. It bundles the ANTLR runtime it parses with.
tomlj = { module = "org.tomlj:tomlj", version.ref = "tomlj" }
# The samples' Compose interface (android/samples): none of it ships in an SDK artifact.
androidx-compose-ui = { module = "androidx.compose.ui:ui", version.ref = "compose" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "material3" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
