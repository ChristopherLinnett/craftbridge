crate = "craftbridge-effects"
file = "src/plugins.rs"
implements = "FX-2"
summary = "The plug-in loader is picked per platform (PD13): with no plug-in folder no hooks on any platform; Android and the desktop answer with EffectCraft's own loader, the confinement guarding which files reach it; iOS answers with a loader gated to the plug-in folder the app names inside its bundle — each iOS engine adds its folder, resolved, to a process-wide list at construction and takes it out again when its app is dropped, because a loader is a plain function pointer, and a folder outside the bundle is never added — which calls EffectCraft's own loader for a module that resolves inside such a folder and refuses every other source in the engine's not-available-in-this-build sentence, so it lands on the Unsupported row as a capability the build was put together without (T24)."
replaces = "the command line's own loader with no folder rule: its headless session takes EffectCraft's loader for every file it may read (crates/host/src/lib.rs:106), and its confine leaves effect.plugins.load open; the per-platform loader choice is the phone's, and its refusal borrows the sentence the engine itself answers when no loader is installed."
