crate = "craftbridge-core"
file = "src/gpu.rs"
implements = "CORE-2a"
summary = "The core makes the GPU device itself: the backend is picked per platform — Metal on iOS, Vulkan on Android, the host's on the desktop, GL never — and the requested limits are wgpu's defaults clamped to the adapter's, with max_texture_dimension_2d capped at 16384 and max_buffer_size taken from the adapter, as the compositor takes those two; the device answers (adapter, device, queue) for Gpu::new, and with no device it answers why in words info.gpu can report while every render runs on the CPU."
replaces = "GpuContext::request()'s own instance and limits (crates/gpu/src/context.rs:1403-1444): it takes any backend, or the ones WGPU_BACKEND names — the emulator's best adapter was its GL translator, with no compute shaders — and asks wgpu::Limits::default() for every limit but those two, which the iOS Simulator's Metal device refused against its 15 inter-stage shader variables (plan/evidence/03-device-feasibility.md Findings 6 and 7, decision D-7). The compositor's own interface stays: the device enters Gpu::new the way the desktop app's does."
depends = [
  "Gpu::new, which takes a device the caller made (crates/gpu/src/lib.rs:162-166)",
  "the adapter limits and the two required limits of GpuContext::request (crates/gpu/src/context.rs:1430-1435)",
  "device_descriptor, whose memory hints the core's own descriptor mirrors (crates/gpu/src/context.rs:816-818)",
  "the device name GpuContext::new gives, adapter and backend, which info.gpu spells alike (crates/gpu/src/context.rs:866)",
  "the words GpuContext::request reports no adapter in, which the core's reason follows (crates/gpu/src/context.rs:1426)",
  "the power preference GpuContext::request asks when WGPU_POWER_PREF is unset, which the core asks (crates/gpu/src/context.rs:340-347)",
]

[[adaptation]]
id = "AD13"
crate = "craftbridge-effects"
file = "src/properties.rs and src/files.rs"
implements = "FX-1b"
summary = "props, get and set answer through the tools the command line's commands of those names call — get_layer, get_property and set_property — with the arguments the command line builds from its own: a comp or layer is an id, an id written as digits, or a name or #n, and `-`, an empty string or nothing is the active comp; a time is a decimal; set's value is the JSON its text parses to, so it arrives as the JSON it is. props's depth follows the tool, which reads a depth only from a whole number: it goes over as the whole number it is, as the command line's mcp door hands it over, and any other number is refused, because the command line's props --depth parses its text as a decimal and so limits nothing. open, save, saveAs and new answer as the commands the command line's --project, --save, --save-as and --empty run, file.open, file.save, file.saveAs and file.newProject, through the door every command goes through (AD10), each with the command's own result; a path is checked by the confinement (AD9) and by nothing of CraftBridge's, and a missing `path` is the engine's own refusal. A tool's refusal of a command it ran is told by its words, not by re-checking the caller's arguments against that command, which the tool built the parameters of."
replaces = "the command line's props, get and set subcommands and its --project, --save, --save-as and --empty options, which read their parameters from text and print what the tools and commands answer (apps/effectcraft-cli/src/main.rs:456-507, :746-788); a library has no text to read and nothing to print."
depends = [
  "the tools get_layer, get_property and set_property, with the arguments they read — layer, comp, depth, time, flat, path, value, expression — their refusals of a missing layer or path and of neither value nor expression, flat's list of leaf properties, and get_layer's depth, a whole number (crates/automation/src/tools.rs:288-358, :633-677, :641)",
  "the argument reads every tool makes, which drop an argument given as null and refuse a missing one as `missing `name`` (crates/automation/src/tools.rs:143-160)",
  "the commands the tools run: layer.tree, which reads its depth only from a whole number, prop.get, prop.set, prop.addKey and prop.setExpression (crates/engine/src/cmd/query.rs:157-168, :216, crates/engine/src/cmd/prop.rs:1421-1432)",
  "file.open, file.save, file.saveAs and file.newProject, their results `{path, savedBy, repaired}`, `{path, bytes}`, and null or `{template}` when the settings open a template, and their refusals `missing `path`` and `no path: use file.saveAs {path}`, the disk's `cannot read`/`cannot write` (AD10) and `… is not a project EffectCraft can open` (crates/engine/src/cmd/file.rs:15-31, :43-113, :790-794)",
  "the confinement's check of a path, which refuses a relative path and `..` and resolves every link that exists before it compares the path with the roots (crates/automation/src/confine.rs:190-206, :656-666), and the session's file write, which writes beside the file and renames over it, so a link inside the container to a file not there yet is replaced inside the container, never followed out of it (crates/engine/src/services.rs:99-101, crates/engine/src/settings/config.rs:196-236)",
  "the command line's reading of a comp or layer reference, a JSON-or-text value and a decimal option, its props, which passes --depth as that decimal, and its backend, which opens --project with file.open and saves with file.save and file.saveAs (apps/effectcraft-cli/src/main.rs:287-303, :456-507, :746-750)",
]
