# The adaptations list required by AGENTS.md §7: every adaptation CraftBridge carries against the
# pinned EffectCraft, with the EffectCraft files and items each one relies on. An adaptation is
# CraftBridge code written against EffectCraft's public interfaces for something a phone needs done
# differently; it never holds a copy of EffectCraft code.
#
# The point of the list is the update loop (plan §24 step 4): when tools/update-upstream.sh moves the
# pin, the revision diff is read against these entries, and every adaptation whose items the diff
# touches is rechecked before the pin is accepted. An adaptation leaves this file the moment EffectCraft
# offers a public interface that does its job (§7: upstream wins), and an entry is updated in the same
# change that alters what it relies on.
#
# File and line references name the revision the pin carries (see [workspace.dependencies] in
# rust/Cargo.toml); item names are EffectCraft's, spelled as its sources spell them. An entry whose files
# are another pinned repository's, FilmCraft's at the revision EffectCraft builds it at, names it in
# `repository`; one without the key relies on EffectCraft's own files. `implements`
# names the plan task that lands each adaptation's code (plan §15); entries are written here before
# their code exists so the first pin's updates already recheck what the first release will carry.
#
# Nothing in this file is generated: it is the list AGENTS.md §7 makes hand-written, by the change
# that adds or alters each adaptation.

[[adaptation]]
id = "AD1"
crate = "craftbridge-effects"
file = "src/session.rs"
implements = "FX-1a"
summary = "Builds CraftBridge's own Session from EffectCraft's public fields: models and plug-ins folders from the app's Folders, EffectCraft's MediaPool, an importer over effectcraft_media::probe, CraftBridge's exporter (AD7), effectcraft_expr's expressions and syntax check, the plug-in loader and previewer when the app names a plug-in folder and the platform carries WebAssembly, no helper hooks, and a plain note that the session renders on the CPU; then effectcraft_script::install."
replaces = "effectcraft_host::session(), which takes its folders from EFFECTCRAFT_CONFIG_DIR or the desktop conventions and starts external helpers — folders and helpers a phone has neither of (crates/host/src/lib.rs:96-147)."
depends = [
  "Session (crates/engine/src/lib.rs:104-269)",
  "effectcraft_media::probe (crates/media/src/probe.rs:17)",
  "effectcraft_script::install (crates/script/src/lib.rs:78)",
  "the headless renderer note the command line sets (apps/effectcraft-cli/src/main.rs:492)",
]

