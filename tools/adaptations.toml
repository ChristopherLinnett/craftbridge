[[adaptation]]
id = "AD19"
crate = "craftbridge-effects"
file = "src/outputs.rs, src/runner.rs and src/methods.rs"
implements = "FX-1i"
summary = "The render runner lists every file a render may write with the core's list_outputs, after the item is queued and before renderQueue.render starts, so the pending-export journal can delete what a killed export left. EffectCraft's own list, Session::outputs_of, is crate-private, so src/outputs.rs follows its rules over public parts, for each queued item (RenderQueueItem::is_queued) and each of its output modules: the module's resolved output path (Session::resolve_output); the bit-depth suffix Append Bit Depth to File Name adds (Prefs::output_name, with the module's own half or float depth for EXR and output_bits otherwise); the segments (Session::segments, over Prefs::segment_frames); then per segment either one numbered file per frame, from the span's first frame, for a sequence format (sequence_path), or the one file of a movie, and the render log beside it (log_path), which the exporter writes when the item's Log setting asks or the render fails, so it is listed whatever the setting. An item the render refuses (no output, a missing comp, a format the exporter does not write) lists nothing, as the render writes nothing of it. The list is handed over in chunks, so a render of a very long sequence never collects it whole and the journal's own size bound refuses what it cannot hold. The session carries no storage-quota hook, so Use Storage Overflow never moves a file to an overflow folder and no other folder is written. The commands that have the exporter write a render the runner has not listed — renderQueue.render, the watch folder's file.watchFolder and file.watchFolder.poll, which render the projects they find, render.saveCurrentPreview, which renders the work area straight to a movie, and file.exportTimeline, which by default renders each layer a timeline cannot hold to a movie in a staging folder of a random name — are refused as Unsupported on every way a call reaches them (on their own, as a step of run, as a step of an engine.batch), through the one reader of the command ids a call reaches that AD11 uses. The one call the door reads past that refusal is a file.exportTimeline whose own prerender parameter reads as the mode that renders nothing in EffectCraft's own reading — the bool false, or none, off, false or no after lower-casing and dropping spaces, underscores and hyphens — a mode in which no layer ever plans a pre-render, where the door reads only parameters passed to the engine untouched and never a $N a batch fills in as it runs; every other call is refused, and only the runner starts a render, after it has listed. Each rule is checked against the files a real render writes (a movie, a sequence, a sequence from a later first frame, a segmented sequence, a segmented movie, the bit-depth suffix for each format, a queue of items and output modules, each render log as the exporter writes it), and a render killed mid-way and then started again leaves no partial file. The adaptation is retired in favour of EffectCraft's own list if EffectCraft makes it public (AGENTS §7)."
replaces = "Session::outputs_of and Session::queued_outputs, which are crate-private at the pin and so cannot be called (crates/engine/src/render_queue.rs:552, :575)."
