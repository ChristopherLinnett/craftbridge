# The adaptations list required by AGENTS.md §7: every adaptation CraftBridge carries against the
# pinned EffectCraft, with the EffectCraft files and items each one relies on. An adaptation is
# CraftBridge code written against EffectCraft's public interfaces for something a phone needs done
# differently; it never holds a copy of EffectCraft code.
#
# The point of the list is the update loop (plan §24 step 3): when tools/update-upstream.sh moves the
# pin, the revision diff is read against these entries, and every adaptation whose items the diff
# touches is rechecked before the pin is accepted. When EffectCraft offers a public interface that does
# an adaptation's job (§7: upstream wins), the adaptation's entry is retired, not removed (below), and an
# entry is updated in the same change that alters what it relies on.
#
# Each `depends` entry is one item the adaptation relies on, in a table of its own: `item` says what it
# is, by the name EffectCraft's sources give it or, where it has none, in words; `at` lists every place
# it occupies at the revision the pin carries (see [workspace.dependencies] in rust/Cargo.toml), each a
# `file` (a path inside the repository the entry's `repository` names) with its `lines` — single lines or
# `first-last` ranges — or without them for the whole file. One claim over many sites stays one item
# with many places. The update script reads files and lines as data, and never looks an item up by its
# name: a revision diff that touches a listed line, or any line of a file listed whole, names the
# adaptation; one that only adds or removes lines above a listed line moves it, and the script gives the
# line it moved to, for the list to be refreshed with the recheck. An entry whose files are another
# pinned repository's, FilmCraft's at the revision EffectCraft builds it at, names it in `repository`;
# one without the key relies on EffectCraft's own files. A place in the shared Craft libraries says so with
# `repository = "storytold/craft-libs"` of its own: EffectCraft and FilmCraft each build the libraries at
# a revision of their own, so the place is read at the revision its entry's app builds them at, which the
# update takes from Cargo's resolved graph before and after the pin. Each `id` is AD followed by a
# number greater than the last entry's, and no id is taken twice, so two changes that each add an
# adaptation cannot both keep the one next id: the reader refuses the later, naming both entries. A gap
# is allowed. A retired entry keeps its id in the order, so the id is never reused, and holds `retired`,
# the id of the upstream commit whose interface replaced the adaptation, and no `depends`: the reader
# checks a retired entry's id with the others, and that it names that commit and holds no `depends`, and
# reads nothing else of it; the update's report lists retired entries apart from the live ones.
# `implements` names the plan task that lands each adaptation's code (plan §15); entries are written
# here before their code exists so the first pin's updates already recheck what the first release will
# carry.
#
# Nothing in this file is generated: it is the list AGENTS.md §7 makes hand-written, by the change
# that adds or alters each adaptation.

