[[adaptation]]
id = "AD10"
crate = "craftbridge-effects"
file = "src/methods.rs and src/info.rs"
implements = "FX-1a"
summary = "The answer table: info beside get_project's document, commands as list_commands, exec as one command's result and run as the list of {command, result}, each in the command line's shapes; every automation and engine error is mapped onto one CraftError row — a command or setting the confinement withholds and a capability the build lacks answer Unsupported; a file access outside the confinement, or a write with nowhere inside it to go, answers Io; an unknown command, an unknown parameter and a parameter the confinement cannot check answer InvalidParams; a missing comp, item, layer or property answers NotFound, in each of the engine's phrasings; everything else answers CommandFailed, a refusal one command passes on from another it ran as the failure of the command that was run; and every failed step of a run names its step, in CommandFailed's step and in the words of every other row, as the CLI's run words it."
replaces = "the CLI's info, exec and run printing (apps/effectcraft-cli/src/main.rs:630-745); a library has no process to print, so the plugin re-speaks those documents and errors through CraftError."
depends = [
