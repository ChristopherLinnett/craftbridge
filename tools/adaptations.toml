[[adaptation]]
id = "AD11"
crate = "craftbridge-effects"
file = "src/methods.rs"
implements = "FX-1a"
summary = "The model downloads start no process: the engine fetches the official weights by starting the system's curl, which is why its own specs mark roto.model.download and face.model.download desktop-only; the phone has no curl to start and the session starts no process, so every way a call reaches either id answers Unsupported before the engine sees the call — as its own command, as one step of a run, and as a step of an engine.batch, whose step ids the plugin reads as the engine reads them (command, else id, never a $N), one level deep because the engine runs no steps of a batch inside a batch; installing weights from a file inside the container — roto.model.install and face.model.install, which the confinement already routes as file reads — stays open as the phone's way to get weights."
replaces = "nothing in the command line: the CLI runs both downloads with the system's curl, which it has; the refusal is the phone's own, taken in the shape of the confinement's per-command refusal."
depends = [
  "download, its curl spawn and the two command specs the engine marks desktop-only (crates/engine/src/analysis/models.rs:639, :655, :714-718, :743-747)",
  "the batch step's id read — command, else id — the $N substitution applied only to parameters, and the refusal of a batch inside a batch before any of its steps run (crates/engine/src/cmd/batch.rs:14, :77-85)",
  "the per-command refusal of the confinement, whose wording this mirrors (crates/automation/src/confine.rs:285-286)",
  "file.runScript, which runs the steps of a command script it reads from a file itself and which the confinement withholds as a command that runs scripts, so those steps never reach the engine (crates/engine/src/cmd/file_more.rs:515-549, crates/engine/src/cmd/scripts.rs:34-35)",
  "the download's only callers being its two command specs: no other command runs it (crates/engine/src/analysis/models.rs:720, :749)",
]

[[adaptation]]
