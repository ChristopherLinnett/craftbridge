repository = "storytold/filmcraft"
implements = "MED-1a, MED-1b"
summary = "Registers CraftBridge's hardware decoder factory in FilmCraft's decoder registry, which EffectCraft opens every movie through, sets FilmCraft's hardware-decoding switch and names the backend for FilmCraft's diagnostics. The factory declines a stream the platform has no hardware decoder for, or cannot start one for, which hands it to FilmCraft's software decoders, and never answers a start's error, which would leave the movie with no decoder; it counts a decline where FilmCraft's own factories count one, only when a decoder cannot start; a decoder it returns is wrapped in Fallback (src/fallback.rs), which follows HybridDecoder's behaviour in CraftBridge's own code: on an error, or a sample whose in-band parameters differ from the sample entry's, it switches to FilmCraft's software decoder for the stream and replays the samples since the last restart sample FilmCraft's stream parsers find (the one before it after an HEVC CRA), within HybridDecoder's bounds, decoding on past a replayed sample the software decoder rejects; it leaves out the pictures the caller already has, puts the ones the hardware decoder still held in presentation order, keeps no sample it returns an error for while it stays on hardware, since FilmCraft's decode loop feeds that sample again, and answers random-access and disposable samples from the stream as the software decoder does. On iOS the hardware decoder is VideoToolbox's (src/platform/videotoolbox.rs), following FilmCraft's macOS VtDecoder in CraftBridge's own code: it declines the streams VtDecoder declines and those other than 4:2:0, starts a session per decoding run, leaves out the RASL pictures of a run started at an HEVC CRA or BLA, puts the pictures in presentation order with the stream's reorder depth, and reads each one out of its biplanar surface into exactly the frame the software decoder returns for the stream; it also takes AV1 where the device decodes it."
replaces = "filmcraft_platform::register(), which registers no decoder on iOS and Android (crates/platform/src/lib.rs:70-139), and its HybridDecoder (crates/platform/src/hybrid.rs), which craftbridge-media does not use: filmcraft-platform always depends on filmcraft-export, which brings its H.264 and FLAC encoders and FilmCraft's compositor, text, caption and audio crates, none of which a decoder needs, into the phone build: 9 more crates in craftbridge-effects-ffi's graph and 25 in the core's own, measured at d5ead4ba. Also its VtDecoder (crates/platform/src/videotoolbox.rs), which it builds for macOS only (crates/platform/Cargo.toml:35, src/lib.rs:49-51). Move onto HybridDecoder if filmcraft-platform gates those dependencies behind a feature the phone build can leave off, and onto VtDecoder on iOS once it also builds it there."
