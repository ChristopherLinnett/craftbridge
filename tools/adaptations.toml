file = "src/fill.rs, src/outputs.rs and src/methods.rs"
implements = "FX-1j"
summary = "The fill runner answers contentFill.generate through request_with_progress, as the render runner answers export: it lists every frame the fill may write with the core's list_outputs before it starts the fill's background task, reports the task's progress every progress interval, and stops the task at the first false. The command writes its frames, fill_00000.png on, into one folder through the session's services from a task nothing but the runner can tell the pending-export journal about, so the runner reads the call as the command does — the composition (an id, a name, or a string of digits read as an id, else the active one), the layer (an id, an index, #n, a name, or the first selected), the range (a call's own work-area or entire spelling, else the panel's setting), the frame count the command computes from the layer's and the work area's points at the composition's frame rate (the frame the nearest boundary to the start falls in, through the frame before the end), and the folder (the call's outputDir, else the first <layer>_Fill_<k> folder beside the project's file, or in the system's temporary folder when it has none) — and hands the command exactly what it read: the composition and layer by id, the folder, the range and no waiting, so the command can write only what was listed. A call it cannot read as the command does (no composition, no layer) is not started: it is handed to the engine with a range the command refuses, which the command checks right after it has resolved both, so it fails in the engine's own words, and a fill never starts for a runner that read too narrowly. A stop sets the task's cancel and waits for its thread, as the render runner waits for its job. A fill that fails then takes away the frames the call made and each folder the call made that then holds nothing, since the engine removes only the fill's own folder and its scratch file makes those above it too, as a restart after a kill does; a fill that is stopped is left to the core, which deletes what the call listed when it answers Cancelled, a stop that lands after the last frame included, since the engine keeps the files of a finished task. Before it lists, the runner checks the folder and every frame with the confinement's own write check, since the confinement checks the folder a call names only as a path it reads (and a relative one not at all, and the folder the command picks for itself not at all) and the session's file services write wherever they are told: a folder or a frame outside the container, in the bundle, relative to the process, or the system's temporary folder an unsaved project defaults to, is refused in the confinement's words whether or not the engine keeps a journal. The journal keeps, apart from the frames, the folder the fill's scratch file and frames make, so a restart after a kill removes it once its frames are gone. The fill's scratch file is an anonymous temporary file the system reclaims, so it needs no listing. The session's own write puts each file down through a temporary file beside it, named for the process and a count the engine keeps to itself, which no listing can name, so the runner starts the task with the session's services wrapped by a writer of its own: the task keeps the services it started with, and the writer writes each listed frame straight to its name, taking away a link there first, as the session's rename over it would, and passes every other call on, and the session has its own services back once the task has started. A frame a kill cuts short is then one the journal lists. The commands that generate a fill the runner has not listed — contentFill.generate through exec, run, engine.batch, replay or an MCP tool, and layer.newContentAwareFill, which generates when it is given parameters and otherwise opens a panel a headless session has none of — are refused as Unsupported on every way a call reaches them, through the one reader of the command ids a call reaches that AD11 and AD19 use. Each rule is checked against the files a real fill writes, and a fill killed mid-way and then started again leaves no frame and no folder it made. The adaptation is retired in favour of EffectCraft's own list if EffectCraft makes it public (AGENTS §7)."
replaces = "nothing in the command line, whose exec waits for the fill and has no journal to tell; the plug-in's call with progress, which a kill must leave no frame behind, has no counterpart at the pin."
