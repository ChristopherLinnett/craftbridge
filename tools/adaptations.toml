  { item = "Backend::headless", at = [{ file = "crates/automation/src/backend.rs", lines = ["33"] }] },
  { item = "Backend::confine", at = [{ file = "crates/automation/src/backend.rs", lines = ["45"] }] },
  { item = "confine::Confinement::new", at = [{ file = "crates/automation/src/confine.rs", lines = ["177"] }] },
