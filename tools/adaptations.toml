file = "src/lib.rs, src/fallback.rs, src/platform/videotoolbox.rs, src/platform/mediacodec.rs, src/mediacodec_input.rs, src/biplanar.rs, src/layout.rs and src/order.rs"
repository = "storytold/filmcraft"
implements = "MED-1a, MED-1b, MED-2a, MED-2b, MED-2c, MED-2d, MED-2e"
summary = "Registers CraftBridge's hardware decoder factory in FilmCraft's decoder registry, which EffectCraft opens every movie through, sets FilmCraft's hardware-decoding switch and names the backend for FilmCraft's diagnostics. The factory declines a stream the platform has no hardware decoder for, or cannot start one for, which hands it to FilmCraft's software decoders, and never answers a start's error, which would leave the movie with no decoder; it counts a decline where FilmCraft's own factories count one, only when a decoder cannot start; a decoder it returns is wrapped in Fallback (src/fallback.rs), which follows HybridDecoder's behaviour in CraftBridge's own code: on an error, or a sample whose in-band parameters differ from the sample entry's, it switches to FilmCraft's software decoder for the stream and replays the samples since the last restart sample FilmCraft's stream parsers find (the one before it after an HEVC CRA), within HybridDecoder's bounds, decoding on past a replayed sample the software decoder rejects; when the hardware decoder fails while the stream's end is flushed it switches the same way, because FilmCraft's VideoDecoder::flush answers pictures and no result, so the hardware decoder answers its own drain's error through CraftBridge's Draining trait and the pictures Fallback's flush returns are the stream's tail from the restart sample the replay starts at, it leaves out the pictures the caller already has, puts the ones the hardware decoder still held in presentation order, keeps no sample it returns an error for while it stays on hardware, since FilmCraft's decode loop feeds that sample again, and answers random-access and disposable samples from the stream as the software decoder does. On iOS the hardware decoder is VideoToolbox's (src/platform/videotoolbox.rs), following FilmCraft's macOS VtDecoder in CraftBridge's own code: it declines the streams VtDecoder declines and those other than 4:2:0, starts a session per decoding run, leaves out the RASL pictures of a run started at an HEVC CRA or BLA, puts the pictures in presentation order with the stream's reorder depth, and reads each one out of its biplanar surface into exactly the frame the software decoder returns for the stream; it also takes AV1 where the device decodes it. On Android the hardware decoder is MediaCodec's (src/platform/mediacodec.rs, through the official NDK bindings), decoding H.264, HEVC and AV1 into an AImageReader, 8-bit pictures as YUV_420_888 images and, from Android 14 (API 34), the first that makes a P010 reader, 10-bit H.264 and HEVC pictures as P010 hardware buffers locked for the CPU, which it accepts only as P010 in the biplanar layout, so no vendor-tiled output format reaches CraftBridge (D-15): it takes the first hardware decoder of the device's codec list (handed over by the app, the NDK listing codecs from API 36 only) for the stream's MIME type, never the platform's default for it, which can be a software codec, and tells hardware by the platform's own answer handed over with the list (MediaCodecInfo.isHardwareAccelerated), declines 10-bit AV1 and 10-bit pictures before Android 14, feeds each H.264 or HEVC sample as Annex B with the record's parameter sets as the codec-specific data Android's table gives (H.264's SPS as csd-0 and its PPS as csd-1; HEVC's VPS, SPS and PPS together as csd-0), and an AV1 stream's temporal units as they are with its av1C record as csd-0, each with its presentation time moved above zero in its order, since MediaCodec takes times as unsigned numbers (src/mediacodec_input.rs), keeps one codec and flushes it, with no start() after it, at a seek or the end of a stream, and makes a fresh one where the flush fails or the codec has output nothing yet, leaves out the same RASL pictures, takes the pictures MediaCodec outputs, which are already in presentation order, drains those it still holds at the end of the stream (a drain that fails, or that sees no end of the stream in time, is an error, and a codec that failed to drain is never fed again), and reads each image's planes, or its P010 buffer's through the conversion VideoToolbox's 10-bit pictures use, into exactly the frame the software decoder returns for the stream."
replaces = "filmcraft_platform::register(), which registers no decoder on iOS and Android (crates/platform/src/lib.rs:70-139), and its HybridDecoder (crates/platform/src/hybrid.rs), which craftbridge-media does not use: filmcraft-platform always depends on filmcraft-export, which brings its H.264 and FLAC encoders and FilmCraft's compositor, text, caption and audio crates, none of which a decoder needs, into the phone build: 9 more crates in craftbridge-effects-ffi's graph and 25 in the core's own, measured at d5ead4ba. Also its VtDecoder (crates/platform/src/videotoolbox.rs), which it builds for macOS only (crates/platform/Cargo.toml:35, src/lib.rs:49-51). Move onto HybridDecoder if filmcraft-platform gates those dependencies behind a feature the phone build can leave off, and onto VtDecoder on iOS once it also builds it there."
