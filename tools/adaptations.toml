  "every sentence of the engine's that ends `not available in this build`, as a refusal, as a command's own and as why a command is disabled (crates/engine/src/cmd/effect.rs:39, :91, :223, :236, crates/engine/src/cmd/file_more.rs:606, :1080, crates/engine/src/cmd/proxy.rs:44, crates/engine/src/cmd/relink.rs:84, crates/engine/src/cmd/panels_cmds.rs:33, :58, crates/engine/src/cmd/render_queue.rs:34, :846, crates/engine/src/cmd/file.rs:321, crates/engine/src/cmd/timeline.rs:121, :123, crates/engine/src/footage/footage_reload.rs:258, crates/engine/src/footage/sequence.rs:270, crates/engine/src/render_queue.rs:597, crates/engine/src/background/offload.rs:476, crates/engine/src/system/library.rs:459, :760, :871, :926, crates/engine/src/scriptui.rs:749, :811, crates/engine/src/session/dispatch.rs:21)",
