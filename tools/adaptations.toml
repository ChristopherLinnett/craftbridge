  { item = "RUNS_SCRIPTS and the confinement's refusal of every command that runs a script, which a script run on the session would bypass: its app.run reaches any command by id past Backend::exec", at = [{ file = "crates/engine/src/cmd/scripts.rs", lines = ["34-35"] }, { file = "crates/engine/src/session/dispatch.rs", lines = ["54-63"] }, { file = "crates/script/src/prelude.js", lines = ["2076"] }] },
]

