[[adaptation]]
id = "AD23"
crate = "craftbridge-effects-codegen"
file = "src/refused.rs"
implements = "GEN-1e"
summary = "The API surface marks what a confined engine refuses, read through the refusal the pinned EffectCraft answers publicly and never through a list of the refused names, which EffectCraft keeps private: the confinement is built over no folder, confined enough to answer with its refusals yet able to name no file of the machine, and it asks each command of the registry by the public check that answers a refused id in one sentence built from the id before it looks at any parameter, and asks the tools on a throwaway headless backend standing under that confinement, because a refused tool answers only when it is run and answers before the tool itself runs. A tool that is not refused runs, so each is handed every argument its own input schema names as `/`, a path outside every folder of that confinement: a tool hands its arguments to the engine's commands, and the confinement refuses a command given such a path before the command runs, so the tool stops there, or earlier at an argument it cannot read, or on the empty session, before it reads, writes or starts anything — asked with empty arguments instead, `list_fonts` would read every font folder of the machine. A tool whose schema names no argument leaves the confinement nothing to stop, so it is run only when the descriptor EffectCraft publishes for it says it only reads, or when it is bridge-only, which the headless backend refuses before it runs; any other is never run and the reading fails naming it, and at the pin the tools that take no argument only query the empty session. Every answer that is an error yet not the refusal's sentence marks nothing; a bridge-only tool answers the headless backend's bridge refusal and the surface marks it with `bridgeOnly` alone, which is how an app loses it anyway. The marks are regenerated with the surface, so when EffectCraft moves its refused lists the marks follow at the next pin with no edit here."
replaces = "nothing in the command line: the refusals belong to EffectCraft's confinement, which the command line runs only under the automation-root flags; what was written here replaces reading nothing — the surface carried no mark of what a confined engine refuses."
