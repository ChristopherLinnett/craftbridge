[[adaptation]]
id = "AD9"
crate = "craftbridge-effects"
file = "src/app.rs and src/replay.rs"
implements = "FX-1a, FX-1d"
summary = "Confinement that is never optional: the Backend is built headless on the AD1 session and confined before its first command — read roots the container and, when the app names one, the bundle; write root the container alone — so every path the engine reads, writes or renders must pass EffectCraft's own confinement check, and no caller of the library can leave the app's folders open. The app answers through effectcraft_automation::McpServer over this backend. Commands that run past Backend::exec do not pass its checks, so replay reads its script's lines first and checks each with Confinement::check_command as the one step of an engine.batch, the confinement's own check of a command that runs later than its check, refusing the whole script before any line runs, and with it a command whose destination only a live lookup can tell."
replaces = "the CLI's opt-in --automation-read-root/--automation-write-root flags, which only its mcp subcommand wires up and which a library session has no command line to be given (apps/effectcraft-cli/src/main.rs:827-831)."
