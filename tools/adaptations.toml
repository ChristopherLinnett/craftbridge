implements = "FX-1a (the seam), FX-1g, MED-3a"
summary = "CraftBridge's exporter (src/exporter.rs), set as Session.exporter from the one function in src/session.rs: hands each job to EffectCraft's FileExporter inside a rayon thread pool with as many threads as half the memory craftbridge-core's available_memory() reports holds the job's largest frame at 16 bytes a pixel (the frame the compositor renders or the one the job's output module writes, whichever is larger; EffectCraft makes each output module and each segment a job of its own), between one and the size of the pool a thread outside any pool runs on (the machine's cores, or what RAYON_NUM_THREADS sets). A job that gets that many, as every job does with no memory figure (every desktop, the iOS Simulator and a phone whose figure cannot be read), runs on its caller's own threads, as FileExporter alone runs it, so the exports of a desktop run as before. A smaller pool is kept for the next job of its size rather than started for each, because EffectCraft keeps state on every thread it renders on (an expression runtime each builds once and never frees). On that pool the caller's progress hook, which is not Send, is run by the thread that called the export, which waits for its answer. For an H.264 or HEVC job whose request chose hardware encoding (the export request's `hardware`, CraftBridge's own option, which is no flag of the command line), src/hardware.rs runs the same queue item through FileExporter, on the same pool, twice with an in-memory sink: as a Targa sequence of the movie's frames (the output module's own crop and resize, channels as the movie would render them, no sound) and as a 16-bit WAV of its sound (the module's rate and channels); it decodes each Targa frame, cuts or pads it to the coded size as EffectCraft's own movies fit theirs, converts it with EffectCraft's own BT.709 limited-range conversion, puts the frames back in order, and encodes them with craftbridge-media's hardware encoder (VideoToolbox on iOS) and the sound with the platform's AAC-LC encoder at 160 kbit/s a channel; craftbridge-media writes the MP4 with FilmCraft's revision of the ISO BMFF writer EffectCraft's export uses: one picture track whose timescale is the frame rate's numerator and whose every sample lasts its denominator, with no reordering and so no composition offsets or edit, tagged with the colour code points of EffectCraft's own movies as limited-range nclx, and an AAC track in the sound's rate whose edit skips the encoder's priming, its units written beside the pictures they play with. A job the hardware path cannot reproduce stays with FileExporter, before anything renders: another format, HEVC at Main 10 or at a chosen level, Skip Existing Files, a storage hook with Use Storage Overflow, a render log beyond errors, a picture or sound the encoders cannot take, or a device with no hardware encoder."
replaces = "FileExporter alone, whose free-memory figure is empty on iOS and Android because sysinfo::memory() has no branch for either (crates/host/src/lib.rs:91-94, crates/engine/src/system/sysinfo.rs:142-168), which leaves frames in flight bounded only by the thread count (crates/export/src/pipeline.rs:140-149, :171-176)."
