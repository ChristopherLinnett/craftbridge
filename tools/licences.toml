# Licences of the dependencies Cargo does not see: Gradle modules and SwiftPM packages.
# `cargo xtask rules` fails when any of these is missing here: a library or a build plugin (by its
# marker module, `<id>:<id>.gradle.plugin`) named in android/sdk/gradle/libs.versions.toml; an external
# module Gradle resolves onto a library module's release, unit-test or instrumented-test runtime
# classpath (the `runtimeLicences` task asks), or onto the gate's own detekt tooling — the rule
# project's compile, runtime and test classpaths and the analyser's own runtime (the
# `gateToolLicences` task asks); a package named in a Package.swift;
# or a pin in an ios/sdk/Package.resolved, once one exists. It also fails when an entry here is no
# longer used.

[maven]
# Build tools the convention plugins compile against; nothing here ships inside an AAR.
"com.android.tools.build:gradle" = "Apache-2.0"
# The build plugins the catalog's [plugins] names, by their marker modules: they run in the build.
"com.android.library:com.android.library.gradle.plugin" = "Apache-2.0"
"com.diffplug.spotless:com.diffplug.spotless.gradle.plugin" = "Apache-2.0"
"org.jetbrains.kotlin.android:org.jetbrains.kotlin.android.gradle.plugin" = "Apache-2.0"
"com.diffplug.spotless:spotless-plugin-gradle" = "Apache-2.0"
"org.jetbrains.kotlin:kotlin-gradle-plugin" = "Apache-2.0"
# What the Kotlin plugin puts on every module's runtime classpath: this ships inside the AAR.
"org.jetbrains.kotlin:kotlin-stdlib" = "Apache-2.0"
"org.jetbrains:annotations" = "Apache-2.0"
# What the generated bindings call through (what ships inside the AAR): JNA offers the Apache-2.0 licence
# beside the LGPL, and CraftBridge takes it under Apache-2.0 (AGENTS.md §8).
"net.java.dev.jna:jna" = "Apache-2.0"
# The coroutines the generated bindings' async calls suspend on, which ship inside the AAR too: the module
# the catalog names, the JVM artifact it resolves to and the platform that aligns them. The detekt tooling
# below resolves the same modules.
"org.jetbrains.kotlinx:kotlinx-coroutines-bom" = "Apache-2.0"
"org.jetbrains.kotlinx:kotlinx-coroutines-core" = "Apache-2.0"
"org.jetbrains.kotlinx:kotlinx-coroutines-core-jvm" = "Apache-2.0"
# Reads the conformance corpus, which is TOML, in the instrumented checks alone (android/sdk/effects); nothing
# that ships carries it. The jar bundles the ANTLR runtime it parses with, which is BSD-3-Clause, and
# both licences are on the allowlist.
"org.tomlj:tomlj" = "Apache-2.0"
# The detekt analyser the gate runs (plan D-28) and the pieces the build's own rules compile and test
# against, with every module their resolution pulls in — read off each module's own POM. They run in the
# build and in the rules' tests; nothing here ships inside an AAR.
"dev.detekt:detekt-cli" = "Apache-2.0"
"dev.detekt:detekt-api" = "Apache-2.0"
"dev.detekt:detekt-core" = "Apache-2.0"
