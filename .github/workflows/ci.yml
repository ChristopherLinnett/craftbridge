# The full gate: tools/ci.sh, every stage of it, on GitHub-hosted runners for every pull request to main and
# every push to it (AGENTS.md §12). Locally a change runs only the checks for what it touches; a merge waits
# for nothing here, and a failure on main is fixed on a branch of its own when it fires.
#
# One job per runner kind, each running `tools/ci.sh --hosted`: every stage runs even after one fails, and the
# job ends `ci: failed: <stages>`, naming each failed stage. tools/ci.sh takes each job's stages from the
# runner's system, RUNNER_OS, and refuses a system it has no job for before any stage runs, so no list or
# group of stages stands here. The Linux job runs the stages that read the same there, among them the host
# tools' and the core's clippy, lint library and test runs, which reach the code only Linux compiles; the
# macOS job, on the newest arm64 image, runs every other stage, each with the reason it is left to macOS.
# tools/ci.sh names them all where it splits them. Every stage runs in at least one job, and none needs a
# physical device or an emulator. The Swift suite runs on one of the runner's own iPhone simulators, which
# `cargo xtask simulator` boots on the newest iOS runtime the image holds and shuts down again once the suite
# has run. The device acceptance runs (plan §28) are no stage of the gate and stay with the machine that has
# the devices.
#
# Every tool the repository pins comes from that pin, never a second list here: the Rust toolchains from
# rust/rust-toolchain.toml and the lint library's, as rustup reads them; the Xcode, cargo-dylint and SwiftLint
# releases from tools/env.sh; the phone targets and the JDK from `cargo xtask pins`; the plan kit's packages
# from plan/package-lock.json. cargo-deny, cargo-ndk, shellcheck and shfmt have no pinned release, and the
# doctor takes any, so each is the newest its source gives, installed as the doctor's own fix says: cargo-deny
# and cargo-ndk by `cargo install`, shellcheck and shfmt from Homebrew — bar shfmt on Linux, which comes from
# Ubuntu's own package, an older release whose syntax tree the shell stage's rule reads alike
# (rust/xtask/src/early_pipes.rs). Both images carry the Android platform and build tools the repository pins,
# which the doctor checks on macOS and the Gradle build needs on Linux; the macOS image also carries the NDK
# r28 the doctor and rust_mobile take (tools/env.sh). The Gradle build compiles no native code, so the Linux
# job needs no NDK, and Ubuntu's image holds no r28.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to a pull request cancels the run it supersedes. Each push to main is a run of its own, so
# every commit main takes is checked.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # A hosted build starts from nothing and is never rebuilt in place, so incremental state only fills the
  # disk; the gate leaves the switch alone because it changes what a build costs, never what a check reads
  # (tools/refused-switches.tsv).
  CARGO_INCREMENTAL: "0"

defaults:
  run:
    shell: bash

jobs:
  gate:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      # Both jobs finish, so one run names every failed stage on either runner.
      fail-fast: false
      matrix:
        include:
          - name: macOS
            runner: macos-26
          - name: Linux
            runner: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Downloads only, keyed on the lockfiles that decide them: a build folder of every stage is larger than
      # the cache a repository has.
      - name: Cache Cargo's downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-${{ runner.os }}-${{ hashFiles('rust/**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Cache Gradle's downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/
            ~/.gradle/wrapper/
          key: gradle-${{ runner.os }}-${{ hashFiles('android/sdk/**/*.gradle.kts', 'android/sdk/**/*.versions.toml', 'android/sdk/**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-
      # SwiftPM fetches only the published packages ios/sdk/Package.resolved records; while the package takes
      # none, there is no such file and nothing to cache.
      - name: Cache SwiftPM's downloads
        if: runner.os == 'macOS' && hashFiles('ios/sdk/Package.resolved') != ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/org.swift.swiftpm/
          key: swiftpm-${{ hashFiles('ios/sdk/Package.resolved') }}
          restore-keys: swiftpm-

      # The image's default Xcode can move to another release; the build is made with the pinned one.
      - name: Select the Xcode tools/env.sh pins
        if: runner.os == 'macOS'
        run: |
          source tools/env.sh
          sudo xcode-select --switch "/Applications/Xcode_$CRAFTBRIDGE_XCODE.app"
          xcodebuild -version

      # tools/ci.sh refuses to start without both pinned toolchains, the lint library's nightly included,
      # whichever stages it runs, and installs nothing itself (tools/env.sh).
      - name: Install the pinned Rust toolchains
        run: |
          source tools/env.sh
          (cd rust && rustup toolchain install)
          (cd "$CRAFTBRIDGE_LINT_LIBRARY" && rustup toolchain install)
      - name: Read the pins
        id: pins
        run: (cd rust && cargo xtask pins) | tee -a "$GITHUB_OUTPUT"
      # The lint library's runs check the phone targets with its own nightly, whose pin lists no targets.
      - name: Add the phone targets to the lint library's toolchain
        if: runner.os == 'macOS'
        run: |
          source tools/env.sh
          pins="$(cd rust && cargo xtask pins)"
          craftbridge_load_pins <<<"$pins"
          # shellcheck disable=SC2086 # one target per word, split on purpose
          (cd "$CRAFTBRIDGE_LINT_LIBRARY" && rustup target add $CRAFTBRIDGE_RUST_TARGETS)
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: ${{ steps.pins.outputs.jdk }}

      - name: Install cargo-deny
        run: cargo install --locked cargo-deny
      # The lint library's runs take it, and so do xtask's tests.
      - name: Install the cargo-dylint release tools/env.sh pins
        run: |
          source tools/env.sh
          cargo install --locked "cargo-dylint@$CRAFTBRIDGE_DYLINT"
      # The doctor asks for it, and rust_mobile's Android targets take the NDK's compilers through it
      # (tools/env.sh); the android stage's Gradle build runs no cargo, so the Linux job needs none.
      - name: Install cargo-ndk
        if: runner.os == 'macOS'
        run: cargo install --locked cargo-ndk
      - name: Install the SwiftLint release tools/env.sh pins
        if: runner.os == 'macOS'
        run: |
          source tools/env.sh
          bin="$RUNNER_TEMP/swiftlint"
          mkdir -p "$bin"
          curl -fsSL "$CRAFTBRIDGE_SWIFTLINT_URL" | tar -xz -C "$bin" swiftlint
          chmod +x "$bin/swiftlint"
          echo "$bin" >>"$GITHUB_PATH"
      - name: Install shellcheck
        if: runner.os == 'macOS'
        run: brew install shellcheck
      # The shell stage reads every script's syntax tree through shfmt (rust/xtask/src/early_pipes.rs),
      # and so do xtask's own tests, which both jobs run: the doctor's own formula on macOS, Ubuntu's own
      # package on Linux.
      - name: Install shfmt
        if: runner.os == 'macOS'
        run: brew install shfmt
      - name: Install shfmt
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes shfmt
      - name: Install the plan kit's packages as plan/package-lock.json pins them
        working-directory: plan
        run: npm ci

      # The rules and the oracle read the pinned EffectCraft from the machine's upstream cache, which a fresh
      # runner lacks: the update script, run on the revision the tree already holds, makes the cache, fetches
      # that revision into it and writes nothing in the tree.
      - name: Fetch the pinned EffectCraft into the upstream cache
        if: runner.os == 'macOS'
        run: |
          rev="$(cd rust && cargo xtask upstream pin)"
          tools/update-upstream.sh "$rev"

      - name: The gate, tools/ci.sh
        run: tools/ci.sh --hosted
