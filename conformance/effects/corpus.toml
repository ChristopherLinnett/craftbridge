[[scenario]]
id = "T15"
title = "export WAV: the same audio, byte for byte"
# The demo project's audio is silence, which any writer reproduces: the comp is a tone, so a mix that is
# wrong in any sample differs. `layer.addItem` takes the item the import answers with, the first the
# project holds after its own comp.
[[scenario.fixture]]
from = "fixtures/tone.wav"
to = "tone.wav"
[[scenario.step]]
args = [
  "run", "--json", "--empty",
  "comp.new", '{"name":"Tone","width":64,"height":48,"duration":0.5,"frameRate":10}',
  "file.import", '{"paths":["<container>/tone.wav"]}',
  "layer.addItem", '{"comp":1,"item":2}',
  "file.save", '{"path":"<container>/tone.ecproj"}',
]
[[scenario.step.call]]
kind = "request"
method = "run"
params = { steps = [
  { command = "comp.new", params = { name = "Tone", width = 64, height = 48, duration = 0.5, frameRate = 10 } },
  { command = "file.import", params = { paths = ["<container>/tone.wav"] } },
  { command = "layer.addItem", params = { comp = 1, item = 2 } },
  { command = "file.save", params = { path = "<container>/tone.ecproj" } },
] }
[[scenario.step]]
args = ["render", "--json", "--project", "<container>/tone.ecproj", "--out", "<container>/export.wav", "--format", "wav"]
[[scenario.step.call]]
kind = "request"
method = "open"
params = { path = "<container>/tone.ecproj" }
[[scenario.step.call]]
kind = "request"
method = "export"
params = { output = "<container>/export.wav", format = "wav" }
progress = {}
[[scenario.same]]
kind = "output"
step = 1
omit = ["/rendered/0/seconds"]
[[scenario.compare]]
kind = "identical"
actual = "export.wav"
reference = "export.wav"

[[scenario]]
id = "T16"
title = "export with queue: the project's own queue, each item within D-12 of the oracle's and the unticked one not rendered"
# Three items on the demo project's comp: H.264, a PNG that is unticked, and VP9.
[[scenario.step]]
args = [
  "run", "--json",
  "renderQueue.add", '{"comp":"EffectCraft Intro","output":"<container>/out/first.mp4","format":"h264","start":1,"end":1.25,"resolution":"quarter"}',
  "renderQueue.add", '{"comp":"EffectCraft Intro","output":"<container>/out/unticked.png","format":"png","start":1,"end":1.25,"resolution":"quarter"}',
  "renderQueue.setRender", '{"index":2,"render":false}',
  "renderQueue.add", '{"comp":"EffectCraft Intro","output":"<container>/out/third.webm","format":"webm","start":1,"end":1.25,"resolution":"quarter"}',
  "file.save", '{"path":"<container>/q.ecproj"}',
]
[[scenario.step.call]]
kind = "request"
method = "run"
params = { steps = [
  { command = "file.openDemoProject" },
  { command = "renderQueue.add", params = { comp = "EffectCraft Intro", output = "<container>/out/first.mp4", format = "h264", start = 1, end = 1.25, resolution = "quarter" } },
  { command = "renderQueue.add", params = { comp = "EffectCraft Intro", output = "<container>/out/unticked.png", format = "png", start = 1, end = 1.25, resolution = "quarter" } },
  { command = "renderQueue.setRender", params = { index = 2, render = false } },
  { command = "renderQueue.add", params = { comp = "EffectCraft Intro", output = "<container>/out/third.webm", format = "webm", start = 1, end = 1.25, resolution = "quarter" } },
  { command = "file.save", params = { path = "<container>/q.ecproj" } },
] }
[[scenario.step]]
args = ["render", "--json", "--project", "<container>/q.ecproj", "--queue"]
[[scenario.step.call]]
kind = "request"
method = "open"
params = { path = "<container>/q.ecproj" }
[[scenario.step.call]]
kind = "request"
method = "export"
params = { queue = true }
progress = {}
[[scenario.expect]]
step = 1
pointer = "/rendered"
length = 2
[[scenario.same]]
kind = "output"
step = 1
omit = ["/rendered/0/seconds", "/rendered/1/seconds"]
[[scenario.folder]]
path = "out"
holds = ["first.mp4", "third.webm"]
[[scenario.compare]]
kind = "frames"
actual = "out/first.mp4"
reference = "out/first.mp4"
[[scenario.compare]]
kind = "frames"
actual = "out/third.webm"
reference = "out/third.webm"

[[scenario]]
id = "T17"
title = "template.render: the running example's frame byte for byte and its export within D-12 of the oracle's"
# The running example in small: a Name text control and a Photo media control, made the way the plan's
# `birthday-card` recipe makes one, on each side. The picture's item is the id the import answers with (66,
# after the ids the solid and the text layer take), which both sides give alike. Name is "Sam" and Photo a
# green picture, which the template's own red one is replaced by.
[[scenario.fixture]]
from = "fixtures/photo.png"
to = "photo.png"
[[scenario.fixture]]
from = "fixtures/sam.png"
to = "sam.png"
[[scenario.fixture]]
from = "fixtures/sam-values.json"
to = "values.json"
names_container = true
[[scenario.step]]
args = [
  "run", "--json", "--empty",
  "comp.new", '{"name":"Card","width":160,"height":90,"duration":2,"frameRate":10}',
  "layer.newSolid", '{"comp":1,"name":"Bg","color":"#223344"}',
  "layer.newText", '{"comp":1,"text":"Hello","name":"Name"}',
  "file.import", '{"paths":["<container>/photo.png"]}',
  "layer.addItem", '{"comp":1,"item":66}',
  "essential.addProperty", '{"comp":1,"layer":"Name","path":"text/sourceText","name":"Name"}',
  "essential.addMedia", '{"layer":"photo.png","name":"Photo"}',
  "essential.exportTemplate", '{"comp":1,"path":"<container>/card.ectemplate"}',
]
[[scenario.step.call]]
kind = "request"
method = "run"
params = { steps = [
  { command = "comp.new", params = { name = "Card", width = 160, height = 90, duration = 2, frameRate = 10 } },
  { command = "layer.newSolid", params = { comp = 1, name = "Bg", color = "#223344" } },
  { command = "layer.newText", params = { comp = 1, text = "Hello", name = "Name" } },
  { command = "file.import", params = { paths = ["<container>/photo.png"] } },
  { command = "layer.addItem", params = { comp = 1, item = 66 } },
  { command = "essential.addProperty", params = { comp = 1, layer = "Name", path = "text/sourceText", name = "Name" } },
  { command = "essential.addMedia", params = { layer = "photo.png", name = "Photo" } },
  { command = "essential.exportTemplate", params = { comp = 1, path = "<container>/card.ectemplate" } },
] }
[[scenario.step]]
args = ["render-frame", "--json", "--template", "<container>/card.ectemplate", "--values", "<container>/values.json", "--time", "1", "--out", "frame.png"]
[[scenario.step.call]]
kind = "frame"
params = { template = "<container>/card.ectemplate", values = { Name = "Sam", Photo = "<container>/sam.png" }, frame = { time = 1 } }
format = "png"
out = "frame.png"
[[scenario.step]]
args = ["render", "--json", "--template", "<container>/card.ectemplate", "--values", "<container>/values.json", "--out", "<container>/card.mp4", "--format", "h264"]
[[scenario.step.call]]
kind = "request"
method = "template.render"
params = { template = "<container>/card.ectemplate", values = { Name = "Sam", Photo = "<container>/sam.png" }, output = { output = "<container>/card.mp4", format = "h264" } }
progress = {}
[[scenario.compare]]
kind = "identical"
actual = "frame.png"
reference = "frame.png"
[[scenario.compare]]
kind = "frames"
actual = "card.mp4"
reference = "card.mp4"

[[scenario]]
id = "T18"
title = "script: the phone build runs no script, so it refuses one before it runs, in the command line's words"
# `script.run` runs scripts, which the phone's confinement withholds on purpose; both confined doors refuse
# each call in the same words, where the command line's own `script` is not confined.
[[scenario.step]]
args = ["mcp", "--empty", "--automation-read-root", ".", "--automation-write-root", "."]
stdin = [
  '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"execute_command","arguments":{"command":"script.run","params":{"code":"app.project.numItems"}}}}',
  '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"execute_command","arguments":{"command":"script.run","params":{"code":"throw new Error(\"the scenario fails here\")"}}}}',
]
[[scenario.step.call]]
kind = "mcp"
[[scenario.expect]]
step = 0
output = 0
pointer = "/result/content/0/text"
equals = "`script.run` is not available while file access is confined (--automation-read-root/--automation-write-root)"
[[scenario.expect]]
step = 0
output = 1
pointer = "/result/isError"
equals = true
[[scenario.same]]
kind = "output"
step = 0

[[scenario]]
id = "T19"
title = "replay of a repro script: an identical report, passing and failing"
[[scenario.fixture]]
from = "fixtures/pass.jsonl"
to = "pass.jsonl"
[[scenario.fixture]]
from = "fixtures/fail.jsonl"
to = "fail.jsonl"
[[scenario.step]]
args = ["replay", "--json", "pass.jsonl"]
[[scenario.step.call]]
kind = "request"
method = "replay"
files = { script = "pass.jsonl" }
[[scenario.step]]
args = ["replay", "--json", "--keep-going", "fail.jsonl"]
fails = true
[[scenario.step.call]]
kind = "request"
method = "replay"
params = { keepGoing = true }
files = { script = "fail.jsonl" }
[[scenario.expect]]
step = 0
pointer = "/ok"
equals = true
[[scenario.expect]]
step = 1
pointer = "/first_failure/line"
equals = 3
[[scenario.same]]
kind = "output"
step = 0
[[scenario.same]]
kind = "output"
step = 1

[[scenario]]
id = "T20"
title = "mcp: initialize, tools/list (27 tools) and tools/call get_project: identical replies"
[[scenario.step]]
args = ["mcp", "--empty", "--automation-read-root", ".", "--automation-write-root", "."]
stdin = [
  '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"conformance","version":"1"}}}',
  '{"jsonrpc":"2.0","method":"notifications/initialized"}',
  '{"jsonrpc":"2.0","id":2,"method":"tools/list"}',
  '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"get_project","arguments":{}}}',
]
[[scenario.step.call]]
kind = "mcp"
[[scenario.expect]]
step = 0
output = 1
pointer = "/result/tools"
length = 27
[[scenario.expect]]
step = 0
output = 2
pointer = "/id"
equals = 3
# The renderer's note names the command line's --gpu start flag, which an app has no way to be given.
[[scenario.same]]
kind = "output"
step = 0
within = [{ pointer = "/result/content/0/text", omit = ["/renderer/why"] }]

