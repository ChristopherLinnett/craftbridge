[[scenario]]
id = "T22"
title = "cancel an export at 50 %: Cancelled, and no output file left"
sides = "plugin"
# The command line stops a render only by its process being killed, so there is no oracle to compare. The
# first step is the same export left alone, which writes its file: what the cancelled one leaves out would
# have been there. The listener answers at its first tenth-of-a-second beat past half the frames. The
# desktop runner holds the export at the first frames that reach half, asking again until the plug-in's
# stop has come, so the exporter always meets that stop with frames left to render and removes the file it
# opened: the folder holds the control's file alone, however fast or slow the machine is. Three hundred
# frames leave a whole batch of at most 16 after the one that passes half, so the stop is always met before
# the last.
# On a device the run is bounded, and this is why. The SDKs cannot hold an export: a seam for it that no app
# could call would need a second native build of every library for the tests alone, since the tests link
# the library an app links. So the export renders on while the stop is on its way: the listener hears it
# only on the engine's beat, and the stop it makes at the first beat past half may reach an export that has
# ended; neither the answer (`Cancelled`) nor the folder says which. The render queue's record does, and the
# step is judged by it: the export's item says `UserStopped` when the exporter met the stop, which passes,
# and `Done` when it had rendered every frame first. A device that renders the second half of the export
# before the stop reaches it reports that race, and never passes, so the desktop runner's hold is what
# makes T22 deterministic. The export is the demo's whole length at half size, and not a short one, so that
# the beat sees it progress by a small part of its frames and the stop meets most of its second half still
# to render.
[[scenario.step]]
[[scenario.step.call]]
kind = "request"
method = "run"
params = { steps = [{ command = "file.openDemoProject" }] }
[[scenario.step.call]]
kind = "request"
method = "export"
params = { output = "<container>/control.mp4", format = "h264", resolution = "half" }
progress = {}
[[scenario.step]]
[[scenario.step.call]]
kind = "request"
method = "run"
params = { steps = [{ command = "file.openDemoProject" }] }
[[scenario.step.call]]
kind = "request"
method = "export"
params = { output = "<container>/cancelled.mp4", format = "h264", resolution = "half" }
progress = { cancel_at = 0.5 }
[[scenario.expect]]
step = 0
pointer = "/rendered"
length = 1
[[scenario.expect]]
step = 1
pointer = "/kind"
equals = "Cancelled"
[[scenario.folder]]
path = "."
holds = ["control.mp4"]

[[scenario]]
id = "T24"
title = "plug-in policy: a WebAssembly effect loads from the plug-in folder the app names, and with none named plug-ins are off"
sides = "plugin"
# These two steps are what every platform answers alike. Where else a module loads from is each platform's
# own rule (PD13): the desktop and Android load what the confinement lets through, the container included,
# and iOS only what its bundle's plug-in folder holds; a module outside every root the folders derive is the
# confinement's refusal, `Io`, on all three.
[[scenario.fixture]]
from = "fixtures/probe.wat"
to = "plug-ins/probe.wasm"
[[scenario.step]]
[scenario.step.host]
plugins = "plug-ins"
[[scenario.step.call]]
kind = "request"
method = "exec"
params = { command = "effect.plugins.load", params = { path = "<container>/plug-ins/probe.wasm" } }
# The same module with no plug-in folder named: plug-ins are off, on every platform.
[[scenario.step]]
[[scenario.step.call]]
kind = "request"
method = "exec"
params = { command = "effect.plugins.load", params = { path = "<container>/plug-ins/probe.wasm" } }
[[scenario.expect]]
step = 0
pointer = "/loaded/0/name"
equals = "Gate Probe"
[[scenario.expect]]
step = 1
pointer = "/kind"
equals = "Unsupported"
