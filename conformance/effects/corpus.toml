[[scenario]]
id = "T6"
title = "frame PNG, demo project, 2 s, 960 px: byte-identical"
[[scenario.step]]
args = ["render-frame", "--json", "--time", "2", "--max-side", "960", "--out", "frame.png"]
[[scenario.step.call]]
kind = "request"
method = "run"
params = { steps = [{ command = "file.openDemoProject" }] }
[[scenario.step.call]]
kind = "frame"
params = { time = 2, maxSide = 960 }
format = "png"
out = "frame.png"
[[scenario.compare]]
kind = "identical"
actual = "frame.png"
reference = "frame.png"

[[scenario]]
id = "T7"
title = "frame straight RGBA, transparent: byte-identical pixels"
# A half-opaque box on a ground that is nothing: where the alpha is neither none nor full a straight pixel
# differs from its premultiplied one, and a colour short of full (#ff8040) also in how each rounds, so the
# pixels hold the straight alpha the frame keeps.
[[scenario.step]]
args = [
  "run", "--json", "--empty",
  "comp.new", '{"name":"T7","width":64,"height":48,"duration":2,"frameRate":10}',
  "layer.newSolid", '{"comp":1,"name":"Box","color":"#ff8040","width":20,"height":20}',
  "prop.set", '{"layer":"Box","path":"transform/opacity","value":50}',
  "file.save", '{"path":"<container>/t7.ecproj"}',
]
[[scenario.step.call]]
kind = "request"
method = "run"
params = { steps = [
  { command = "comp.new", params = { name = "T7", width = 64, height = 48, duration = 2, frameRate = 10 } },
  { command = "layer.newSolid", params = { comp = 1, name = "Box", color = "#ff8040", width = 20, height = 20 } },
  { command = "prop.set", params = { layer = "Box", path = "transform/opacity", value = 50 } },
  { command = "file.save", params = { path = "<container>/t7.ecproj" } },
] }
[[scenario.step]]
args = ["render-frame", "--json", "--project", "<container>/t7.ecproj", "--time", "0", "--transparent", "--out", "frame.png"]
[[scenario.step.call]]
kind = "request"
method = "open"
params = { path = "<container>/t7.ecproj" }
[[scenario.step.call]]
kind = "frame"
params = { time = 0, transparent = true }
format = "rgba8"
out = "frame.png"
[[scenario.compare]]
kind = "pixels"
actual = "frame.png"
reference = "frame.png"

[[scenario]]
id = "T8"
title = "frame on the GPU against the CPU: within the compositor's GPU tolerance"
[[scenario.step]]
args = ["render-frame", "--json", "--time", "2", "--max-side", "960", "--out", "frame.png"]
[scenario.step.host]
gpu = true
[[scenario.step.call]]
kind = "request"
method = "run"
params = { steps = [{ command = "file.openDemoProject" }] }
[[scenario.step.call]]
kind = "frame"
params = { time = 2, maxSide = 960 }
format = "png"
out = "frame.png"
# The compositor's own rule for a render on the GPU against the CPU's (crates/gpu/src/tests.rs `check` at
# the pin): 8-bit output differs by at most one level, bar rounding flips on a decision boundary, which it
# allows in 0.3 % of the pixels and no further than four levels.
[[scenario.compare]]
kind = "pixels"
actual = "frame.png"
reference = "frame.png"
tolerance = 1
allowed_fraction = 0.003
cap = 4

# The exports below are short, since the gate runs them for every change to the plug-in and the plug-in
# renders in the runner's debug build. Those of the demo project are the quarter second from 1 s at a
# quarter of its size, bar T9's two seconds at half, which are the plan's, and T22's, which says why. The
# span and the size are where the comparison sees a setting the plug-in passes wrongly: the demo's first
# half second is smooth text on a gradient, over which a VP9 or AV1 export held to 50 kbps comes within
# D-12 of the oracle's, as an HEVC one does at a tenth of the size; from 1 s it draws rings and ticks, and
# none does. Each export is held to what plan §28 asks of it, a video to D-12 against the oracle's own
# file, frame by frame, with the same frame count and size; and the answer to `export` is the one
# `render --json` prints, bar the seconds the render took.
[[scenario]]
id = "T9"
title = "export H.264, demo, 2 s, half resolution: every frame within D-12 of the oracle's"
[[scenario.step]]
args = ["render", "--json", "--out", "<container>/export.mp4", "--format", "h264", "--end", "2", "--resolution", "half"]
[[scenario.step.call]]
kind = "request"
method = "run"
params = { steps = [{ command = "file.openDemoProject" }] }
[[scenario.step.call]]
kind = "request"
method = "export"
params = { output = "<container>/export.mp4", format = "h264", end = 2, resolution = "half" }
progress = {}
[[scenario.expect]]
step = 0
pointer = "/rendered"
length = 1
[[scenario.same]]
kind = "output"
step = 0
omit = ["/rendered/0/seconds"]
[[scenario.compare]]
kind = "frames"
actual = "export.mp4"
reference = "export.mp4"

