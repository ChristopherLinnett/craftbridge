# The EffectCraft conformance corpus (plan §28): the scenarios every platform's runner reads, with the
# EffectCraft command line as the oracle. A scenario is its steps, each one invocation of the command line
# (`args`, and what it reads on standard input as `stdin`) and the calls that make the same step on the
# plug-in (`[[scenario.step.call]]`), run in order in one scratch folder per side (a relative path is
# relative to that folder), and the checks made afterwards. Every step starts its side afresh, so what one
# step leaves for the next is in files, as it is for the command line. The text <container> in an argument,
# a line of stdin or a call is the side's own folder: the plug-in takes absolute paths, and both sides are
# given the folder the same way.
#
#   sides = "both" | "oracle" | "plugin"   which sides run it; both by default
#   [[scenario.fixture]]     from (relative to this file), to (in each side's folder): a file it starts with;
#                            names_container: its text says <container> where the side's folder goes
#   fails = true             on a step: the command line ends it with a failure status and prints its answer
#   [scenario.step.host]     plugins (the plug-in folder the app names, relative to the container), gpu
#                            (the app is handed the machine's GPU)
#   [[scenario.step.call]]   kind = "request": method, params, files (a parameter read from a file), progress
#                            (the call is one that reports progress, as `export` and `template.render` are;
#                            cancel_at, a fraction of its frames, is where the listener stops it, and the
#                            call must not finish before that stop reaches it: the desktop runner holds the
#                            export at that point until it does, whatever the machine's speed, and fails the
#                            step of a call it held nowhere, as a fill, or whose stop never came. A runner
#                            that reaches the engine only through the SDK has no exporter to hold, and T22
#                            says what its stop is then judged by)
#                            kind = "frame": params, format = "png" | "rgba8", out
#                            kind = "mcp": every line of stdin, each reply printed
#   [[scenario.expect]]      step, output, pointer (RFC 6901), equals or length: a value in a JSON document
#                            a step printed, on every side that ran; a plug-in call that fails prints
#                            {"error", "kind"} where the command line's --json prints {"error"}
#   [[scenario.same]]        kind = "output": the two sides printed the same documents, the scratch folder
#                            as one marker, apart from omit (pointers), entries (pointers taken out of each
#                            array entry whose key starts with a prefix) and within (pointers inside a
#                            document a string holds)
#                            kind = "timings": the same runs, layers, effects and playback were timed, no
#                            measurement compared
#   [[scenario.folder]]      path (`.` is the side's folder), holds: the names the folder holds when the steps
#                            are done, on every side that ran, and no others; names that start with a dot
#                            are the side's own working files
#   [[scenario.compare]]     kind = "identical": two files are byte for byte the same, or two folders hold
#                            the same files with the same bytes
#                            kind = "frames": two decoded images or movies have the same size and, for two
#                            movies, frame count, and every frame is within 40 dB PSNR of its counterpart
#                            (D-12), or with exact every frame is the same pixel for pixel;
#                            actual_frame / reference_frame pick the one frame compared
#                            kind = "pixels": two PNGs' straight RGBA pixels, each within tolerance levels
#                            in all but allowed_fraction of the pixels and none past cap
#                            kind = "json": two files are the same JSON document
#
# In a comparison `reference` is the file the oracle wrote and `actual` the one the plug-in wrote. A scenario
# that runs on one side alone, on the oracle while the plug-in cannot answer it yet or on the plug-in where
# the command line has nothing to compare, compares that side's own files, so both are its own. A runner
# with no oracle, as a phone's, checks that each file a comparison names is there and holds something, and
# makes the one comparison that needs no oracle: a `pixels` comparison in a scenario whose steps ask for
# the GPU, which it holds against the same steps made on the CPU, as the oracle renders them.
#
# The values below are the pinned revision's (tools/update-upstream.sh moves it); a pin update that
# changes one is rechecked against the new revision's command line, never edited to pass.

[[scenario]]
id = "T1"
title = "info: the command and effect counts and the version at the pin, and the command line's state"
[[scenario.step]]
args = ["info", "--json"]
# The command line opens its demo project unless told not to, so the plug-in is asked to.
[[scenario.step.call]]
kind = "request"
method = "run"
params = { steps = [{ command = "file.openDemoProject" }] }
[[scenario.step.call]]
kind = "request"
method = "info"
[[scenario.expect]]
step = 0
pointer = "/version"
equals = "0.24.1"
[[scenario.expect]]
step = 0
pointer = "/commands"
equals = 763
[[scenario.expect]]
step = 0
pointer = "/effects"
equals = 308
# The plug-in names its engine and pin beside the same state, says where it renders and what its hardware
# decoders have done and which encoder made the pictures of its exports, and has no start flag for the renderer's note to name. The command line prints no pin to hold the plug-in's to:
# that is the constant `cargo xtask generate` writes from the workspace's pin, which the gate regenerates.
[[scenario.same]]
kind = "output"
step = 0
omit = ["/mode", "/engine", "/pin", "/gpu", "/hardwareDecoding", "/decoding", "/encoding", "/renderer/why", "/project/renderer/why"]

[[scenario]]
id = "T2"
title = "commands with schemas: identical ids, labels and schemas"
[[scenario.step]]
args = ["commands", "--json", "--schemas"]
[[scenario.step.call]]
kind = "request"
method = "commands"
params = { schemas = true }
[[scenario.expect]]
step = 0
pointer = ""
length = 763
# A phone starts no helper process, so its session lists the helper commands as it cannot run them
# (`enabled`, `why`), where the command line lists them as it can; their ids, labels and schemas are compared.
[[scenario.same]]
kind = "output"
step = 0
entries = [{ pointer = "", key = "id", prefix = "effect.helpers.", omit = ["/enabled", "/why"] }]

[[scenario]]
id = "T3"
title = "run: comp, solid, text, Gaussian Blur; save; reopen"
[[scenario.step]]
args = [
  "run", "--json", "--empty",
  "comp.new", '{"name":"T3","width":640,"height":360,"duration":3,"frameRate":30}',
  "layer.newSolid", '{"comp":1,"name":"Bg"}',
  "layer.newText", '{"comp":1,"text":"Hello","name":"Title"}',
  "effect.apply", '{"comp":1,"layer":"Title","effect":"Gaussian Blur"}',
  "file.save", '{"path":"<container>/t3.ecproj"}',
  "file.open", '{"path":"<container>/t3.ecproj"}',
]
[[scenario.step.call]]
kind = "request"
method = "run"
params = { steps = [
  { command = "comp.new", params = { name = "T3", width = 640, height = 360, duration = 3, frameRate = 30 } },
  { command = "layer.newSolid", params = { comp = 1, name = "Bg" } },
  { command = "layer.newText", params = { comp = 1, text = "Hello", name = "Title" } },
  { command = "effect.apply", params = { comp = 1, layer = "Title", effect = "Gaussian Blur" } },
  { command = "file.save", params = { path = "<container>/t3.ecproj" } },
  { command = "file.open", params = { path = "<container>/t3.ecproj" } },
] }
[[scenario.step]]
args = ["info", "--json", "--project", "<container>/t3.ecproj"]
[[scenario.step.call]]
kind = "request"
method = "open"
params = { path = "<container>/t3.ecproj" }
[[scenario.step.call]]
kind = "request"
method = "info"
[[scenario.expect]]
step = 0
pointer = ""
length = 6
[[scenario.expect]]
step = 1
pointer = "/activeComp/name"
equals = "T3"
[[scenario.same]]
kind = "output"
step = 0
[[scenario.same]]
kind = "output"
step = 1
omit = ["/mode", "/engine", "/pin", "/gpu", "/hardwareDecoding", "/decoding", "/encoding", "/renderer/why", "/project/renderer/why"]
[[scenario.compare]]
kind = "json"
actual = "t3.ecproj"
reference = "t3.ecproj"

