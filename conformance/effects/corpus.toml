# The EffectCraft conformance corpus (plan §28): the scenarios every platform's runner reads, with the
# EffectCraft command line as the oracle. A scenario is its steps, each one invocation of the command line
# run in order in one scratch folder (a relative path in `args` is relative to that folder), and the checks
# made afterwards:
#
#   [[scenario.expect]]   step, pointer (RFC 6901), equals: a value in the JSON a step printed
#   [[scenario.compare]]  kind = "identical": two files are byte for byte the same
#                         kind = "frames": two decoded images or movies have the same size and, for two
#                         movies, frame count, and every frame is within 40 dB PSNR of its counterpart (D-12);
#                         actual_frame / reference_frame pick the one frame compared
#
# The side under test runs the same steps in a scratch folder of its own and meets the same expectations;
# in a comparison `reference` is the file the oracle wrote and `actual` the one the side under test wrote.
# Until craftbridge-effects answers the steps the desktop runner has the oracle alone, so the oracle is
# both sides, and a comparison checks one file it wrote against another.
#
# The values below are the pinned revision's (tools/update-upstream.sh moves it); a pin update that
# changes one is rechecked against the new revision's command line, never edited to pass.

[[scenario]]
id = "T1"
title = "info: the command and effect counts at the pin"
[[scenario.step]]
args = ["info", "--json"]
[[scenario.expect]]
step = 0
pointer = "/version"
equals = "0.24.1"
[[scenario.expect]]
step = 0
pointer = "/commands"
equals = 763
[[scenario.expect]]
step = 0
pointer = "/effects"
equals = 308

[[scenario]]
id = "T5"
title = "set an expression on Rotation and get it at 1 s"
[[scenario.step]]
args = ["set", "-", "EFFECTCRAFT", "transform/rotation", "--expression", "time*90", "--save-as", "t5.ecproj"]
[[scenario.step]]
args = ["get", "--project", "t5.ecproj", "-", "EFFECTCRAFT", "transform/rotation", "--time", "1", "--json"]
[[scenario.expect]]
step = 1
pointer = "/evaluated"
equals = 90

[[scenario]]
id = "T9"
title = "export H.264, demo, 2 s, half resolution: frame 30 is within D-12 of the oracle's own frame"
[[scenario.step]]
args = ["render", "--out", "export.mp4", "--format", "h264", "--end", "2", "--resolution", "half"]
[[scenario.step]]
args = ["render-frame", "--frame", "30", "--max-side", "960", "--out", "frame30.png"]
[[scenario.compare]]
kind = "frames"
actual = "export.mp4"
actual_frame = 30
reference = "frame30.png"
