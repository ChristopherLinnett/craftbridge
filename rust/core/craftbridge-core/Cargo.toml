[package]
name = "craftbridge-core"
description = "The universal runtime that hosts a Craft app's session on iOS and Android."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
craftbridge-media.workspace = true
# The error mapping takes serde_json's errors in one place, not at every call site: JSON that does
# not parse is InvalidParams and JSON that could not be read is Io (plan §14).
serde_json.workspace = true
# A folder's write probe: a fresh name made only if nothing holds it, removed again, so two engines
# starting at once never share one. The folder tests' scratch folders come from it too.
tempfile.workspace = true
# The core makes the GPU device itself, with adapter-clamped limits and a per-platform backend (plan §17).
wgpu.workspace = true
# Blocking on wgpu's adapter and device futures, as EffectCraft does (never a hand-written spin).
pollster.workspace = true
# Each call's answer, which the engine thread sends and a caller blocks on or awaits (plan §16).
oneshot.workspace = true
# The journal folds a name's Unicode form when the volume holding it folds forms, which std cannot:
# no platform call answers the rule (pathconf carries a case flag on Apple volumes alone, and none
# answers form), so the journal reads it by asking the volume, and folds names as its answer said.
unicode-normalization.workspace = true
# And it folds a name's case, when the volume folds case, by Unicode's full case folding, as a Mac's
# disk does (`straße` and `STRASSE`, `ſ` and `s`, are one name there), which std's lower-casing is not.
unicase.workspace = true

# The faces CoreText offers an iOS app, which only an iPhone or its simulator has; the features are the
# framework headers the platform module reads (src/platform/coretext.rs).
[target.'cfg(target_os = "ios")'.dependencies]
objc2-core-foundation = { workspace = true, features = ["std", "CFArray", "CFString", "CFURL"] }
objc2-core-text = { workspace = true, features = ["std", "CTFontCollection", "CTFontDescriptor", "CTFontManager"] }

# The kernel's capability bits, read before any app code runs on an Android arm64 phone, whose library is
# built for half-precision arithmetic (src/platform/cpu.rs).
[target.'cfg(all(target_os = "android", target_arch = "aarch64"))'.dependencies]
libc.workspace = true

# The core's tests rerun an ignored child test in a fresh process whose environment differs, which is
# the only way to prove the environment switches nothing the core chooses. The support crate is host
# code, and a core crate may take it from its tests only (AGENTS.md §2).
[dev-dependencies]
craftbridge-process.workspace = true

# The fifo the journal's lock tests make on Android, made by the system call: its error number tells the
# adb shell's refusal of a fifo, which skips those tests, from a fault of the test's own, which the
# `mkfifo` program's exit status cannot. Elsewhere a refusal skips nothing, so the program makes it there.
[target.'cfg(target_os = "android")'.dev-dependencies]
rustix = { workspace = true, features = ["fs"] }

[lints]
workspace = true
