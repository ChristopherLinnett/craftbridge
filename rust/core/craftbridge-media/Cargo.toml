[package]
name = "craftbridge-media"
description = "Hardware video decoders for Craft app plugins, registered through FilmCraft's decoder registry, and hardware encoders with the MP4 they write."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# CraftBridge's decoders register into FilmCraft's decoder registry, the one EffectCraft decodes
# through (plan §18); the layer table's `upstream` row for this crate names the ones below and no others.
# The revisions are the pin [workspace.dependencies] carries, written by tools/update-upstream.sh.
filmcraft-codecs.workspace = true
filmcraft-isobmff.workspace = true
# The picture and colour types a decoder returns: the hardware decoders' frames are built in FilmCraft's own
# layout.
filmcraft-color.workspace = true
filmcraft-frame.workspace = true

# Apple's frameworks, which only an iPhone, its simulator or a Mac has; the features are the framework headers
# the decoder (iOS only) and the encoders read (src/platform/). The encoders build on a Mac too, so the host
# tests run the same framework calls the phone makes.
[target.'cfg(target_vendor = "apple")'.dependencies]
objc2-core-foundation = { workspace = true, features = ["std", "CFArray", "CFBase", "CFDictionary", "CFNumber", "CFData", "CFString"] }
objc2-core-media = { workspace = true, features = ["std", "CMBase", "CMBlockBuffer", "CMFormatDescription", "CMSampleBuffer", "CMTime"] }
objc2-core-video = { workspace = true, features = ["std", "CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVReturn"] }
objc2-video-toolbox = { workspace = true, features = ["std", "VTCompressionProperties", "VTCompressionSession", "VTDecompressionSession", "VTDecompressionProperties", "VTErrors", "VTSession", "objc2-core-media", "objc2-core-video"] }
objc2-audio-toolbox = { workspace = true, features = ["std", "AudioCodec", "AudioConverter", "objc2-core-audio-types"] }
objc2-core-audio-types = { workspace = true, features = ["std", "CoreAudioBaseTypes"] }

# Android's media NDK, which only an Android build has; the features are the media bindings and the API level
# the SDK's minSdk names (src/platform/mediacodec.rs).
[target.'cfg(target_os = "android")'.dependencies]
ndk = { workspace = true, features = ["media", "api-level-29"] }

[lints]
workspace = true
