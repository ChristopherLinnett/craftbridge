allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
cognitive-complexity-threshold = 30
# The never-crash calls again, by path: clippy's own lints for them do not look inside a `macro_rules!`
# expansion or at a method taken as a value (`.map(Option::unwrap)`), and these do. They also name the
# other ways to stop the process. Tests are linted apart with both lints allowed (tools/ci.sh), as the
# `allow-*-in-tests` settings above allow the lints they shadow.
disallowed-methods = [
    { path = "core::option::Option::unwrap", reason = "never crash: return the error (AGENTS.md §3)" },
    { path = "core::option::Option::expect", reason = "never crash: return the error (AGENTS.md §3)" },
    { path = "core::result::Result::unwrap", reason = "never crash: return the error (AGENTS.md §3)" },
    { path = "core::result::Result::expect", reason = "never crash: return the error (AGENTS.md §3)" },
    { path = "core::result::Result::unwrap_err", reason = "never crash: return the error (AGENTS.md §3)" },
    { path = "core::result::Result::expect_err", reason = "never crash: return the error (AGENTS.md §3)" },
    { path = "std::process::abort", reason = "never crash: the engine keeps the document and returns an error (AGENTS.md §3)" },
    { path = "std::panic::panic_any", reason = "never crash: return the error (AGENTS.md §3)" },
    { path = "std::panic::resume_unwind", reason = "never crash: return the error (AGENTS.md §3)" },
]
disallowed-macros = [
    { path = "core::panic", reason = "never crash: return the error (AGENTS.md §3)" },
    { path = "std::panic", reason = "never crash: return the error (AGENTS.md §3)" },
    { path = "core::todo", reason = "never crash: return the error (AGENTS.md §3)" },
    { path = "std::todo", reason = "never crash: return the error (AGENTS.md §3)" },
    { path = "core::unimplemented", reason = "never crash: return the error (AGENTS.md §3)" },
    { path = "std::unimplemented", reason = "never crash: return the error (AGENTS.md §3)" },
    { path = "core::unreachable", reason = "never crash: return the error (AGENTS.md §3)" },
    { path = "std::unreachable", reason = "never crash: return the error (AGENTS.md §3)" },
]
