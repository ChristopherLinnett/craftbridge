[package]
name = "craftbridge-effects-conformance"
description = "Runs the EffectCraft conformance corpus against the plugin and the EffectCraft CLI."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

# A host tool may depend on anything. It decodes what an export wrote with EffectCraft's own media crate,
# the registry CraftBridge's decoders register into, so a frame is decoded the way the engine decodes it.
[dependencies]
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tempfile.workspace = true
craftbridge-process.workspace = true
effectcraft-media.workspace = true
effectcraft-time.workspace = true
# The plug-in side of every scenario: the runner starts itself with the plug-in's calls (`--plugin-step`),
# so both sides run as processes under one environment.
craftbridge-core.workspace = true
craftbridge-effects.workspace = true
# Writes the PNG of a straight-RGBA frame and reads a PNG back as the pixels it holds.
image.workspace = true

[lints]
workspace = true
