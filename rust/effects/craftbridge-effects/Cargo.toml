[package]
name = "craftbridge-effects"
description = "The EffectCraft plugin: EffectCraft's command-line capabilities as a method table."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
craftbridge-core.workspace = true
# The hardware encoders and the movie they write (plan §18); the plugin keeps the choice of when to use them.
craftbridge-media.workspace = true

# The plugin builds against EffectCraft itself: an adaptation (AGENTS.md §7) calls EffectCraft's public
# interfaces, so the interfaces are dependencies. Every rev is the pin `tools/update-upstream.sh` wrote
# into [workspace.dependencies] (plan §15 "Pins"); the plugin names the crates, never the revisions.
effectcraft-engine.workspace = true
effectcraft-host.workspace = true
effectcraft-automation.workspace = true
effectcraft-gpu.workspace = true
effectcraft-render.workspace = true
effectcraft-time.workspace = true
effectcraft-text.workspace = true
effectcraft-media.workspace = true
effectcraft-expr.workspace = true
effectcraft-script.workspace = true
effectcraft-plugin.workspace = true
# The colour conversion EffectCraft's own export makes before it encodes (plan §18): the hardware export feeds
# its encoder the same planes.
effectcraft-raster.workspace = true
serde_json.workspace = true
rustix.workspace = true
# The export's thread pool (AD7).
rayon.workspace = true
# The Targa frames and the WAV the hardware export takes from EffectCraft's export (plan §18);
# the crate's tests read PNGs with the same `image`.
image.workspace = true
symphonia.workspace = true
# The name of a staged copy, a hash of what it holds that no toolchain changes (src/staging.rs).
siphasher.workspace = true
# The plugin hands the core's wgpu device to the compositor and installs its failure callbacks,
# which speak wgpu's own types (plan §17); the version is the workspace's, shared with the core.
wgpu.workspace = true

# D-8: boa's default packed-value layout panics on Android, where heap pointers carry a tag in
# their top byte (plan/evidence/03-device-feasibility.md Finding 9); the `jsvalue-enum` feature
# gives boa a layout that tolerates it. Only Android needs it, so this crate asks for it through a
# target-specific dependency and Cargo unifies the feature over every boa in the Android build —
# EffectCraft's own script and expression crates included — and over no other target. The
# workspace's entry keeps boa's default features off, as EffectCraft's does, so Android's
# expressions get the layout and nothing the desktop's do not have.
[target.'cfg(target_os = "android")'.dependencies]
boa_engine = { workspace = true, features = ["jsvalue-enum"] }

[dev-dependencies]
# The font listing's test of every app-facing entry writes the face list, which is one per process, so
# it reruns itself alone in a child through the workspace's one helper for that.
craftbridge-process.workspace = true
tempfile.workspace = true
# The D-8 test reads the toolchain pin's targets with the TOML parser the workspace's tools use.
toml.workspace = true

[lints]
workspace = true
