# cargo deny check licenses bans sources (tools/ci.sh). Advisories need the network and run separately.

[graph]
# Every feature's dependencies, so one a feature pulls in is licence-checked like the rest.
all-features = true

[licenses]
version = 2
# The one licence allowlist. `cargo xtask rules` reads it for Gradle and SwiftPM dependencies too.
# MPL-2.0 is allowed only for dependencies used unmodified (UniFFI).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "BSL-1.0",
    "MPL-2.0",
]
# No `[licenses.private]`: cargo-deny's `ignore = true` skips every crate marked `publish = false`,
# a git dependency's too, not only this workspace's own crates, which carry the allowed MIT OR Apache-2.0.
confidence-threshold = 0.9

[bans]
# Duplicates of EffectCraft, FilmCraft and Craft library crates are an error (`cargo xtask rules`);
# other duplicates are common in large graphs and only reported.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Official repositories only: EffectCraft is built from storytold revisions as they are, never from a fork
# (AGENTS.md §7); the others are the sources EffectCraft's own manifest uses.
allow-git = [
    "https://github.com/storytold/effectcraft",
    "https://github.com/storytold/filmcraft",
    "https://github.com/storytold/craft-libs",
    "https://github.com/storytold/egui.git",
    "https://github.com/storytold/winit.git",
]
