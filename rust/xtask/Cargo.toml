[package]
name = "xtask"
description = "CraftBridge's rule checks and regeneration: `cargo xtask <rules|generate>`."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

# roxmltree reads the XML of the Maven repositories' version lists; serde_json reads `cargo metadata`;
# toml reads the manifests and the licence files; toml_edit writes the upstream tables of rust/Cargo.toml
# as Cargo's own TOML layer, keeping everything else in the file byte for byte in the form it prints;
# unicode-normalization answers whether a path is in NFC, which std cannot; syn reads Rust sources as the
# language does, with proc-macro2's tokens and quote's printing of its tree back into them, so the unsafe
# and lint-attribute checks never scan Rust as text. No other crates: the checks stay small enough that
# std covers walking, and a lint gate that needs its own dependencies to build is a gate that cannot run
# when they break.
[dependencies]
proc-macro2.workspace = true
quote.workspace = true
serde_json.workspace = true
syn.workspace = true
toml.workspace = true
toml_edit.workspace = true
roxmltree.workspace = true
unicode-normalization.workspace = true

# `cargo xtask device-lock` runs a device's whole run in a process group of its own, which the support
# crate's watchers end together when the run is killed; the tests that must meet a changed environment
# run one of their own again in a child, in that crate's code too, shared with the conformance runner
# and the core's tests.
craftbridge-process.workspace = true

[lints]
workspace = true
