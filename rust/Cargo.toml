[workspace]
resolver = "3"
members = ["core/*", "effects/*", "xtask"]
# Host tools build only when named, so a plain `cargo build` builds the libraries.
default-members = ["core/*", "effects/craftbridge-effects", "effects/craftbridge-effects-ffi"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.99"
repository = "https://github.com/ChristopherLinnett/craftbridge"
publish = false

[workspace.dependencies]
craftbridge-media = { path = "core/craftbridge-media" }
craftbridge-core = { path = "core/craftbridge-core" }
craftbridge-core-ffi = { path = "core/craftbridge-core-ffi" }
craftbridge-effects = { path = "effects/craftbridge-effects" }

# xtask
serde_json = "1"
toml = "0.9"

# One definition for every crate: each manifest says `[lints] workspace = true`, and
# `cargo xtask rules` fails if one does not or if this table is weakened.
[workspace.lints.rust]
# `deny`, not `forbid`: the UniFFI scaffolding and the platform modules need `allow`, which
# `forbid` would refuse. Where `allow(unsafe_code)` may appear is checked by `cargo xtask rules`.
unsafe_code = "deny"

[workspace.lints.clippy]
# Never crash (the Craft house rules): no panicking shortcuts outside tests.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
unreachable = "deny"
undocumented_unsafe_blocks = "deny"
# EffectCraft's own workspace lints, so CraftBridge's code meets the bar EffectCraft's does. `dbg_macro`
# is denied where EffectCraft only warns: a `dbg!` left in a library prints into the host app's log.
cognitive_complexity = "deny"
too_many_arguments = "deny"
wildcard_imports = "deny"
dbg_macro = "deny"
needless_range_loop = "allow"
type_complexity = "allow"
