[workspace]
resolver = "3"
members = ["core/*", "effects/*", "xtask"]
# Host tools build only when named, so a plain `cargo build` builds the libraries.
default-members = ["core/*", "effects/craftbridge-effects", "effects/craftbridge-effects-ffi"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.99"
repository = "https://github.com/ChristopherLinnett/craftbridge"
publish = false

[workspace.dependencies]
craftbridge-media = { path = "core/craftbridge-media" }
craftbridge-core = { path = "core/craftbridge-core" }
craftbridge-core-ffi = { path = "core/craftbridge-core-ffi" }
craftbridge-effects = { path = "effects/craftbridge-effects" }

# The workspace's external libraries: what the host tools use, and the few a shipped crate uses.
# serde's `derive` gives a file format one definition, its Rust types: the API surface file, which the
# codegen writes and its diff reads back, and the conformance corpus craftbridge-effects-conformance reads.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The process's CPU time, which `timings` reports beside wall time as the command line's `bench` does,
# read from the system clock through the crate the core's `tempfile` already brings into every build.
rustix = { version = "1", features = ["time"] }
toml = "0.9"
toml_edit = "0.25"
# The XML a Maven repository publishes its versions in.
roxmltree = "0.21"
unicode-normalization = "0.1"
# The Rust syntax tree the gate's unsafe and lint-attribute checks read: `syn` parses a source file as
# the language does, `proc-macro2` gives its tokens line numbers, and `quote` prints an attribute back to
# the tokens the checks read.
syn = { version = "2", default-features = false, features = ["parsing", "printing", "full", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
# The core's write probe of a folder and the scratch folders of its tests;
# craftbridge-effects-conformance runs each scenario in one.
tempfile = "3"
# `image` writes the PNGs craftbridge-effects-conformance's tests compare.
image = { version = "0.25", default-features = false, features = ["png"] }
# The core creates its wgpu device itself (plan §17, D-7). The version and features are exactly the
# pinned EffectCraft workspace's, so one wgpu builds both and the device the core makes is of the type
# the compositor's `Gpu::new` takes: with a second wgpu in the lock they would be two types, and the
# hand-over would not compile.
wgpu = { version = "30.0.1", features = ["fragile-send-sync-non-atomic-wasm"] }
# The core blocks on wgpu's adapter and device futures with the executor EffectCraft blocks on.
pollster = "1"
# craftbridge-effects' tests ask the thread pool EffectCraft's exporter renders on how many threads it
# has, to hand the command line they compare against the same number. It resolves to the one copy
# EffectCraft already builds, so the pool that answers is the exporter's own.
rayon = "1"

effectcraft-engine = { git = "https://github.com/storytold/effectcraft", rev = "10376058" }
effectcraft-host = { git = "https://github.com/storytold/effectcraft", rev = "10376058" }
effectcraft-automation = { git = "https://github.com/storytold/effectcraft", rev = "10376058" }
effectcraft-gpu = { git = "https://github.com/storytold/effectcraft", rev = "10376058" }
effectcraft-render = { git = "https://github.com/storytold/effectcraft", rev = "10376058" }
effectcraft-time = { git = "https://github.com/storytold/effectcraft", rev = "10376058" }
effectcraft-text = { git = "https://github.com/storytold/effectcraft", rev = "10376058" }
effectcraft-media = { git = "https://github.com/storytold/effectcraft", rev = "10376058" }
effectcraft-expr = { git = "https://github.com/storytold/effectcraft", rev = "10376058" }
effectcraft-script = { git = "https://github.com/storytold/effectcraft", rev = "10376058" }
effectcraft-plugin = { git = "https://github.com/storytold/effectcraft", rev = "10376058" }
filmcraft-codecs = { git = "https://github.com/storytold/filmcraft", rev = "d5ead4ba1ee2f1cd13cb86a4239aee2730a3d9f5" }
filmcraft-color = { git = "https://github.com/storytold/filmcraft", rev = "d5ead4ba1ee2f1cd13cb86a4239aee2730a3d9f5" }
filmcraft-frame = { git = "https://github.com/storytold/filmcraft", rev = "d5ead4ba1ee2f1cd13cb86a4239aee2730a3d9f5" }
filmcraft-isobmff = { git = "https://github.com/storytold/filmcraft", rev = "d5ead4ba1ee2f1cd13cb86a4239aee2730a3d9f5" }

# Apple's media frameworks, for the iOS hardware decoder in craftbridge-media (plan §18). Each crate turns on
# only the framework headers it reads.
objc2-core-foundation = { version = "0.3.2", default-features = false }
objc2-core-media = { version = "0.3.2", default-features = false }
objc2-core-video = { version = "0.3.2", default-features = false }
objc2-video-toolbox = { version = "0.3.2", default-features = false }

# Android's official NDK bindings (rust-mobile/ndk), for the Android hardware decoder in craftbridge-media
# (plan §18): MediaCodec, AImageReader and their formats. The crate turns on only the media feature and the
# API level the SDK's minSdk names.
ndk = { version = "0.9", default-features = false }

# One definition for every crate: each manifest says `[lints] workspace = true`, and
# `cargo xtask rules` fails if one does not or if this table is weakened.
[workspace.lints.rust]
# `deny`, not `forbid`: the UniFFI scaffolding and the platform modules need `allow`, which
# `forbid` would refuse. Where `allow(unsafe_code)` may appear is checked by `cargo xtask rules`.
unsafe_code = "deny"

[workspace.lints.clippy]
# Never crash (the Craft house rules): no panicking shortcuts outside tests, no stopping the process, and
# no unchecked index into a slice, array or vector (`indexing_slicing`) or a string (`string_slice`, which
# `indexing_slicing` leaves to it). Those with no item-level exception are `forbid`, so the compiler itself
# refuses every `allow` of them, however it is spelt and wherever the file sits; tests keep `unwrap`,
# `expect`, `panic!` and indexing through rust/clippy.toml's `allow-*-in-tests`. `expect_used` stays
# `deny` for its one exception, an item-level allow on a provably infallible literal.
unwrap_used = "forbid"
expect_used = "deny"
panic = "forbid"
unimplemented = "forbid"
todo = "forbid"
unreachable = "forbid"
exit = "forbid"
indexing_slicing = "forbid"
string_slice = "forbid"
undocumented_unsafe_blocks = "deny"
# The same calls by path (rust/clippy.toml), which also reach a macro's expansion and a method taken as a
# value; `deny`, because an item's `.expect("…")` on a provably infallible literal allows both.
disallowed_methods = "deny"
disallowed_macros = "deny"
# EffectCraft's own workspace lints, so CraftBridge's code meets the bar EffectCraft's does. `dbg_macro`
# is denied where EffectCraft only warns: a `dbg!` left in a library prints into the host app's log.
cognitive_complexity = "deny"
too_many_arguments = "deny"
wildcard_imports = "deny"
dbg_macro = "deny"
needless_range_loop = "allow"
type_complexity = "allow"

# Written by tools/update-upstream.sh from the pinned EffectCraft; never edit by hand (AGENTS.md §6, §7).
[profile.release]
lto = "thin"
codegen-units = 1

# Written by tools/update-upstream.sh from the pinned EffectCraft; never edit by hand (AGENTS.md §6, §7).
[patch.crates-io]
hayro-syntax = { git = "https://github.com/storytold/craft-libs", rev = "e7c3dda7f3e339dd2c8d40fc4eb405472be1a1e4", version = "=0.7.2" }
hayro-jbig2 = { git = "https://github.com/storytold/craft-libs", rev = "e7c3dda7f3e339dd2c8d40fc4eb405472be1a1e4", version = "=0.3.0" }
ecolor = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
emath = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint_default_fonts = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-winit = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-wgpu = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_glow = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_extras = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_kittest = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
eframe = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
# Patch a crate only together with the dependency that needs it: an unused patch makes the Nix
# build, which uses vendored sources, fail (`cargo xtask lock-patches`).
winit = { git = "https://github.com/storytold/winit.git", rev = "a517b3846ee8457d84ee4975110bfda6797c44dc" }
