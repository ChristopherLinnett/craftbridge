[workspace]
resolver = "3"
members = ["core/*", "effects/*", "craftbridge-process", "uniffi-bindgen", "xtask"]
# Exactly the crates the layer table (rust/xtask/src/layers.rs) says ship, which `cargo xtask rules` holds
# this list to: host tools build only when named, so a plain `cargo build` builds the libraries, and the
# gate's phone-target runs, which lint the default members, read every crate an app links.
default-members = ["core/*", "effects/craftbridge-effects", "effects/craftbridge-effects-ffi"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.99"
repository = "https://github.com/ChristopherLinnett/craftbridge"
publish = false

[workspace.dependencies]
craftbridge-media = { path = "core/craftbridge-media" }
craftbridge-core = { path = "core/craftbridge-core" }
craftbridge-core-ffi = { path = "core/craftbridge-core-ffi" }
craftbridge-effects = { path = "effects/craftbridge-effects" }
craftbridge-effects-ffi = { path = "effects/craftbridge-effects-ffi" }
craftbridge-process = { path = "craftbridge-process" }

# The workspace's external libraries: what the host tools use, and the few a shipped crate uses.
# serde's `derive` gives a file format one definition, its Rust types: the API surface file, which the
# codegen writes and its diff reads back, and the conformance corpus craftbridge-effects-conformance reads.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The process's CPU time, which `timings` reports beside wall time as the command line's `bench` does,
# read from the system clock through the crate the core's `tempfile` already brings into every build;
# and whether the system has a process of an id, which the engine start asks before it takes a killed
# write's temporary file named for its writer (AD21).
rustix = { version = "1", features = ["time", "process"] }
toml = "0.9"
toml_edit = "0.25"
# The XML a Maven repository publishes its versions in.
roxmltree = "0.21"
unicode-normalization = "0.1"
# Unicode's full case folding, by which a volume that folds case holds two spellings as one name.
unicase = "2"
# The Rust syntax tree the gate's unsafe and lint-attribute checks read: `syn` parses a source file as
# the language does, `proc-macro2` gives its tokens line numbers, and `quote` prints an attribute back to
# the tokens the checks read.
syn = { version = "2", default-features = false, features = ["parsing", "printing", "full", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
# The core's write probe of a folder and the scratch folders of its tests;
# craftbridge-effects-conformance runs each scenario in one.
tempfile = "3"
# The kernel's capability bits on Android arm64, which the core reads before any app code runs
# (`getauxval`), through the C library's own declarations.
libc = "0.2"
# `image` writes the PNG a straight-RGBA frame is held in and reads the PNGs a scenario compares in
# craftbridge-effects-conformance, writes the PNGs the tests of that crate and craftbridge-effects compare,
# and reads the Targa frames craftbridge-effects' hardware export takes from EffectCraft's export (plan §18).
image = { version = "0.25", default-features = false, features = ["png", "tga"] }
# Reads the WAV EffectCraft's export hands craftbridge-effects' hardware export, in the crate and with the
# features FilmCraft's codecs already build symphonia with.
symphonia = { version = "0.5.5", default-features = false, features = ["pcm", "wav"] }
# The core creates its wgpu device itself (plan §17, D-7). The version and features are exactly the
# pinned EffectCraft workspace's, so one wgpu builds both and the device the core makes is of the type
# the compositor's `Gpu::new` takes: with a second wgpu in the lock they would be two types, and the
# hand-over would not compile.
wgpu = { version = "30.0.1", features = ["fragile-send-sync-non-atomic-wasm"] }
# The core blocks on wgpu's adapter and device futures with the executor EffectCraft blocks on.
pollster = "1"
# craftbridge-effects' exporter runs EffectCraft's export on a smaller pool of its own when the memory
# is short (AD7), and its tests ask the global pool how many threads it has. It resolves to the one copy EffectCraft already builds, so
# the pool EffectCraft's export counts its threads in is the pool this one builds.
rayon = "1"
# The native boundary (plan §20). The one version builds the scaffolding in each -ffi crate and, through
# rust/uniffi-bindgen, the generator that reads it back, so the two can never differ.
uniffi = "0.32"
# The channel the engine thread answers each call on (plan §16): a caller blocks on it or awaits it, so the
# FFI's async calls wait for the engine's own answer without blocking a thread. It is the channel the
# JavaScript engine in EffectCraft's graph already uses.
oneshot = { version = "0.2", features = ["std", "async"] }
# The JavaScript engine EffectCraft's scripts and expressions run on, as the pinned EffectCraft workspace
# asks for it — the same version, its default features off — so the one boa in the lock is that one, built
# with only the features EffectCraft and this workspace turn on (D-8).
boa_engine = { version = "0.22", default-features = false }
# craftbridge-effects names each copy it stages after a SipHash of the bytes the copy holds: the name
# outlives the build that made it, so it must not change with the toolchain or the platform, as std's
# own hasher may. It resolves to the one copy boa's interner already brings into every build.
siphasher = "1"

effectcraft-engine = { git = "https://github.com/storytold/effectcraft", rev = "10376058" }
effectcraft-host = { git = "https://github.com/storytold/effectcraft", rev = "10376058" }
effectcraft-automation = { git = "https://github.com/storytold/effectcraft", rev = "10376058" }
effectcraft-gpu = { git = "https://github.com/storytold/effectcraft", rev = "10376058" }
effectcraft-render = { git = "https://github.com/storytold/effectcraft", rev = "10376058" }
effectcraft-time = { git = "https://github.com/storytold/effectcraft", rev = "10376058" }
effectcraft-text = { git = "https://github.com/storytold/effectcraft", rev = "10376058" }
effectcraft-media = { git = "https://github.com/storytold/effectcraft", rev = "10376058" }
effectcraft-expr = { git = "https://github.com/storytold/effectcraft", rev = "10376058" }
effectcraft-script = { git = "https://github.com/storytold/effectcraft", rev = "10376058" }
effectcraft-plugin = { git = "https://github.com/storytold/effectcraft", rev = "10376058" }
effectcraft-raster = { git = "https://github.com/storytold/effectcraft", rev = "10376058" }
filmcraft-codecs = { git = "https://github.com/storytold/filmcraft", rev = "d5ead4ba1ee2f1cd13cb86a4239aee2730a3d9f5" }
filmcraft-color = { git = "https://github.com/storytold/filmcraft", rev = "d5ead4ba1ee2f1cd13cb86a4239aee2730a3d9f5" }
filmcraft-frame = { git = "https://github.com/storytold/filmcraft", rev = "d5ead4ba1ee2f1cd13cb86a4239aee2730a3d9f5" }
filmcraft-isobmff = { git = "https://github.com/storytold/filmcraft", rev = "d5ead4ba1ee2f1cd13cb86a4239aee2730a3d9f5" }
# The software H.264 encoder a movie goes on in when its hardware encoder is lost (plan §18): the one EffectCraft's
# own export encodes with, at the library revision EffectCraft builds it at, with the same library's H.264 parameter
# set and slice header readers and its bit reader and writer, which rename the encoder's parameter sets.
craft-video = { git = "https://github.com/storytold/craft-libs", rev = "e7c3dda7f3e339dd2c8d40fc4eb405472be1a1e4", default-features = false, features = ["h264-encode", "h264-decode"] }
craft-media = { git = "https://github.com/storytold/craft-libs", rev = "e7c3dda7f3e339dd2c8d40fc4eb405472be1a1e4", default-features = false, features = ["bitstream"] }

# Apple's frameworks, through the bindings generated from their headers: the media ones for the iOS hardware
# decoder in craftbridge-media (plan §18), CoreText for the faces craftbridge-core's iOS platform module reads
# (plan §16), and QuartzCore's (Core Animation's) layer class the preview surface is made on (plan §20), with
# the Objective-C runtime crate they stand on, whose retained reference holds the app's layer. Each crate turns
# on only the framework headers it reads.
objc2 = "0.6"
objc2-core-foundation = { version = "0.3.2", default-features = false }
objc2-core-media = { version = "0.3.2", default-features = false }
objc2-audio-toolbox = { version = "0.3.2", default-features = false }
objc2-core-audio-types = { version = "0.3.2", default-features = false }
objc2-core-text = { version = "0.3.2", default-features = false }
objc2-core-video = { version = "0.3.2", default-features = false }
objc2-quartz-core = { version = "0.3.2", default-features = false }
objc2-video-toolbox = { version = "0.3.2", default-features = false }

# Android's official NDK bindings (rust-mobile/ndk), for the Android hardware decoder in craftbridge-media
# (plan §18): MediaCodec, AImageReader and their formats; and for the window the preview draws on in
# craftbridge-core-ffi (plan §20). Each crate turns on only the features it reads: craftbridge-media the media
# feature and the API level the SDK's minSdk names.
ndk = { version = "0.9", default-features = false }

# One definition for every crate: each manifest says `[lints] workspace = true`, and
# `cargo xtask rules` fails if one does not or if this table is weakened.
[workspace.lints.rust]
# `deny`, not `forbid`: the UniFFI scaffolding and the platform modules need `allow`, which
# `forbid` would refuse. Where `allow(unsafe_code)` may appear is checked by `cargo xtask rules`.
unsafe_code = "deny"

[workspace.lints.clippy]
# Never crash (the Craft house rules): no panicking shortcuts outside tests, no stopping the process, and
# no unchecked index into a slice, array or vector (`indexing_slicing`) or a string (`string_slice`, which
# `indexing_slicing` leaves to it). Those with no item-level exception are `forbid`, so the compiler itself
# refuses every `allow` of them, however it is spelt and wherever the file sits; tests keep `unwrap`,
# `expect`, `panic!` and indexing through rust/clippy.toml's `allow-*-in-tests`. `expect_used` stays
# `deny` for its one exception, an item-level allow on a provably infallible literal.
unwrap_used = "forbid"
expect_used = "deny"
panic = "forbid"
unimplemented = "forbid"
todo = "forbid"
unreachable = "forbid"
exit = "forbid"
indexing_slicing = "forbid"
string_slice = "forbid"
undocumented_unsafe_blocks = "deny"
# The same calls by path (rust/clippy.toml), which also reach a macro's expansion and a method taken as a
# value; `deny`, because an item's `.expect("…")` on a provably infallible literal allows both.
disallowed_methods = "deny"
disallowed_macros = "deny"
# EffectCraft's own workspace lints, so CraftBridge's code meets the bar EffectCraft's does. `dbg_macro`
# is denied where EffectCraft only warns: a `dbg!` left in a library prints into the host app's log.
cognitive_complexity = "deny"
too_many_arguments = "deny"
wildcard_imports = "deny"
dbg_macro = "deny"
needless_range_loop = "allow"
type_complexity = "allow"

# Written by tools/update-upstream.sh from the pinned EffectCraft; never edit by hand (AGENTS.md §6, §7).
[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev]
opt-level = 1
# Panics and backtraces keep file and line; full debug info only made the many test binaries large.
debug = "line-tables-only"

# Pixel hot loops: keep debug builds interactive.
[profile.dev.package.effectcraft-raster]
opt-level = 3

[profile.dev.package.effectcraft-render]
opt-level = 3

[profile.dev.package.effectcraft-gpu]
opt-level = 3

[profile.dev.package.effectcraft-effects]
opt-level = 3

[profile.dev.package.effectcraft-track]
opt-level = 3

[profile.dev.package.effectcraft-path]
opt-level = 3

[profile.dev.package.effectcraft-media]
opt-level = 3

[profile.dev.package.effectcraft-opusenc]
opt-level = 3

[profile.dev.package.effectcraft-export]
opt-level = 3

# craft-libs codec hot loops.
[profile.dev.package.craft-video]
opt-level = 3

[profile.dev.package.craft-audio]
opt-level = 3

[profile.dev.package.craft-media]
opt-level = 3

# FilmCraft codec hot loops (same settings as FilmCraft's own workspace).
[profile.dev.package.filmcraft-h264]
opt-level = 3

[profile.dev.package.filmcraft-hevc]
opt-level = 3

[profile.dev.package.filmcraft-vp9]
opt-level = 3

[profile.dev.package.filmcraft-dnx]
opt-level = 3

[profile.dev.package.filmcraft-av1]
opt-level = 3

# Written by tools/update-upstream.sh from the pinned EffectCraft; never edit by hand (AGENTS.md §6, §7).
[profile.release]
lto = "thin"
codegen-units = 1

